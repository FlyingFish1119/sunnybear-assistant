<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
    <title>SunnyBear 助手</title>
    <link rel="icon" type="image/png" href="icon/icon.png">
    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="lib/element-plus.css">
    <!-- Vue 3 -->
    <script src="lib/vue.global.prod.js"></script>
    <!-- Element Plus 组件库 -->
    <script src="lib/element-plus.full.min.js"></script>
    <!-- lucide 图标 -->
    <script src="lib/lucide.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="lib/katex.min.css">
    <script src="lib/katex.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="lib/mermaid.min.js"></script>
    <!-- 项目本地封装 -->
    <script src="api.js"></script>
    <script src="utils/render-markdown.js"></script>
    <script src="utils/color.js"></script>
    <script src="utils/mermaid.js"></script>
    <script src="utils/file-url.js"></script>
    <script src="utils/ws-bus.js"></script>
    <script src="stores/session-store.js"></script>
    <script src="directives/auto-follow.js"></script>
    <script src="directives/infinite-scroll.js"></script>
    <script src="components/tool-confirm/tool-confirm.js"></script>
    <script src="components/tool-question/tool-question.js"></script>
    <script src="components/confirm-dialog/confirm-dialog.js"></script>
    <script src="components/chat-session-name/chat-session-name.js"></script>
    <script src="components/chat-sidebar/chat-sidebar.js"></script>
    <script src="components/file-upload/file-upload.js"></script>
    <script src="components/chat-connection/chat-connection.js"></script>
    <script src="components/auto-resize-textarea/auto-resize-textarea.js"></script>
    <script src="components/command-suggest/command-suggest.js"></script>
    <script src="components/agent-log-sidebar/agent-log-sidebar.js"></script>
    <script src="components/message-topbar/message-topbar.js"></script>
    <script src="components/send-area/send-area.js"></script>
    <script src="components/message-area/message-area.js"></script>
    <!-- 样式 -->
    <link rel="stylesheet" href="css/scrollbar.css"/>
    <link rel="stylesheet" href="css/layout.css"/>
    <!-- 三大板块样式：侧边栏 | 消息栏 | 发送栏 -->
    <link rel="stylesheet" href="components/chat-sidebar/chat-sidebar.css"/>
    <link rel="stylesheet" href="components/message-area/message-area.css"/>
    <link rel="stylesheet" href="components/message-topbar/message-topbar.css"/>
    <link rel="stylesheet" href="components/chat-session-name/chat-session-name.css"/>
    <link rel="stylesheet" href="css/send-area.css"/>
    <link rel="stylesheet" href="components/send-area/send-area.css"/>
    <link rel="stylesheet" href="components/file-upload/file-upload.css"/>
    <link rel="stylesheet" href="css/markdown.css"/>
    <link rel="stylesheet" href="components/tool-confirm/tool-confirm.css"/>
    <link rel="stylesheet" href="components/tool-question/tool-question.css"/>
    <link rel="stylesheet" href="components/confirm-dialog/confirm-dialog.css"/>
    <link rel="stylesheet" href="components/chat-connection/chat-connection.css"/>
    <link rel="stylesheet" href="components/auto-resize-textarea/auto-resize-textarea.css"/>
    <link rel="stylesheet" href="components/command-suggest/command-suggest.css"/>
    <link rel="stylesheet" href="components/agent-log-sidebar/agent-log-sidebar.css"/>
    <!-- highlight.js 代码高亮样式 -->
    <link rel="stylesheet" href="lib/highlight-github-dark.min.css">
</head>
<body>
<div id="in-loading">
</div>
<div id="app" :style="{'--main-color': mainColor, '--bg-user': userBubbleBg}">
    <chat-sidebar
        :main-color="mainColor"
        :collapsed="sidebarCollapsed"
        @toggle-collapsed="sidebarCollapsed = !sidebarCollapsed"
    ></chat-sidebar>
    <div class="message-area-wrapper" :class="{ 'expanded': sidebarCollapsed }">
        <!-- 拖拽上传遮罩 -->
        <div class="drag-overlay" v-show="dragOver">
            <div :style="{'--main-color': mainColor}" class="drag-overlay-content">
                <i data-lucide="upload-cloud"></i>
                <span>释放文件以上传</span>
            </div>
        </div>
        <div class="message-area-background" :style="backgroundStyle"></div>
        <message-topbar
            :main-color="mainColor"
            :ws-url="wsUrl"
        ></message-topbar>
        <message-area
            :main-color="mainColor"
            :user-settings="userSettings"
            :assistant-settings="assistantSettings"
        ></message-area>
        <agent-log-sidebar :main-color="mainColor"></agent-log-sidebar>
        <send-area
            ref="sendArea"
            :main-color="mainColor"
            @drag-over-change="isChange => dragOver = isChange"
        ></send-area>
    </div>
</div>

<script>
    const app = Vue.createApp({
        data() {
            return {
                mainColor: "lightsalmon",
                userSettings: { background: '', opacity: 0.3 },
                assistantSettings: { avatar: '', assistantName: '' },
                // 标记 app 是否已完成加载并可见，避免在 #app display:none 期间
                // 设置 background-image 导致浏览器跳过图片请求
                loaded: false,

                // 桌面端侧边栏折叠
                sidebarCollapsed: false,
                // 拖拽上传悬停状态（由发送区组件上抛，控制消息区遮罩）
                dragOver: false,
            }
        },

        computed : {
            wsUrl: function () {
                return API.ws.url
            },
            // 用户消息气泡背景色：跟随主色自动变浅
            userBubbleBg() {
                return ColorUtils.lighten(this.mainColor, 0.25);
            },
            backgroundStyle() {
                const bg = this.userSettings.background;
                // loaded 为 false 时 #app 仍是 display:none，
                // 此时设置 background-image 浏览器不会发起请求
                if (!bg || !this.loaded) return { display: 'none' };
                // 如果不是 http(s) 协议，则走服务端本地文件代理
                let url = bg;
                if (!/^https?:\/\//i.test(bg)) {
                    url = API.fileProxyUrl(bg);
                }
                return {
                    backgroundImage: "url('" + url + "')",
                    opacity: this.userSettings.opacity != null ? this.userSettings.opacity : 0.3
                };
            },
        },

        inject: ['sessionStore'],

        methods: {

            inLoading() {
                document.getElementById("app").style.display = "none";
                document.getElementById("in-loading").style.display = "block";
            },

            outLoading() {
                document.getElementById("in-loading").style.display = "none";
                let appStyle = document.getElementById("app").style;
                appStyle.transition = "all 0.5s ease";
                appStyle.opacity = "0";
                appStyle.width = "50dvw";
                appStyle.display = "flex";
                // 此时 #app 已可见，通知 Vue 可以设置 background-image 了
                // 这样浏览器才会真正发起背景图请求
                this.loaded = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        appStyle.transition = "all 1s ease";
                        appStyle.opacity = "1";
                        appStyle.width = "100dvw";
                    })
                });
            },

            async init() {
                this.inLoading();
                await this.fetchUserSettings();
                await this.fetchAssistantSettings();
                this.outLoading();
            },

            async fetchUserSettings() {
                try {
                    const result = await API.settings.user.get();
                    if (result.status === 200) {
                        this.userSettings = result.data || { background: '', opacity: 0.3 };
                        // 从服务端获取主题色
                        if (this.userSettings.mainColor) {
                            this.mainColor = this.userSettings.mainColor;
                        }
                    }
                } catch (error) {
                    console.error('获取用户设置失败:', error);
                }
                // 服务端没有则回退到 localStorage
                if (!this.userSettings.mainColor) {
                    try {
                        const saved = localStorage.getItem('assistant-mainColor');
                        if (saved) {
                            this.mainColor = saved;
                        }
                    } catch (e) {}
                }
            },

            async fetchAssistantSettings() {
                try {
                    const result = await API.settings.assistant.get();
                    if (result.status === 200) {
                        this.assistantSettings = result.data || { avatar: '', assistantName: '' };
                    }
                } catch (error) {
                    console.error('获取助手设置失败:', error);
                }
            },

            /* ========== TTS 语音朗读（实际播放逻辑在发送区组件内） ========== */

            /** 当前语音朗读开关状态（发送区组件持有，供 replace/edit 请求复读开关） */
            currentTtsEnabled() {
                return this.$refs.sendArea ? this.$refs.sendArea.isTtsEnabled() : false;
            },

            /** 清空播放队列并停掉当前音频（停止/切会话/新轮/发新消息时调用） */
            clearTtsQueue() {
                if (this.$refs.sendArea) {
                    this.$refs.sendArea.clearTtsQueue();
                }
            },

            /**
             * 滚动消息列表到底部
             * @param {boolean} force - 为 true 时无视 _autoFollowPaused 强制滚动
             */
            scrollToBottom(force = false) {
                if (!force) {
                    var listEl = document.querySelector('.message-area-list');
                    if (listEl && listEl._autoFollowPaused) return;
                }
                this.$nextTick(() => {
                    requestAnimationFrame(() => {
                        var el = document.querySelector('.message-area-list');
                        if (el) {
                            el.scrollTop = el.scrollHeight;
                        }
                    });
                });
            },

            /**
             * 使用 requestAnimationFrame 合并图标刷新，避免流式传输时频繁全量扫描 DOM
             */
            _scheduleIconRefresh() {
                if (this._iconRefreshScheduled) return;
                this._iconRefreshScheduled = true;
                requestAnimationFrame(() => {
                    lucide.createIcons();
                    this._iconRefreshScheduled = false;
                });
            },

        },

        mounted() {
            lucide.createIcons();
            // 注册 SessionStore 的 UI 副作用钩子（DOM / TTS），数据与 UI 解耦
            this.sessionStore.registerUi({
                scrollToBottom: (force) => this.scrollToBottom(force),
                renderMermaid: () => MermaidUtils.renderAll(),
                clearTts: () => this.clearTtsQueue(),
                enqueueTts: (audio) => { if (this.$refs.sendArea) this.$refs.sendArea.enqueueTtsAudio(audio); },
                playMessageAudio: (msg) => { if (this.$refs.sendArea) this.$refs.sendArea.playMessageAudio(msg); },
                isTtsEnabled: () => this.currentTtsEnabled(),
                clearMdCache: () => this.$md.clearCache(),
                clearSendArea: () => { if (this.$refs.sendArea) this.$refs.sendArea.clear(); }
            });
            this.init();
        },

        updated() {
            this._scheduleIconRefresh();
        },
    });

    // 注册全局工具 & 指令
    app.config.globalProperties.$fileUrl = FileUrlUtils;
    app.config.globalProperties.$md = MarkdownUtils;
    // 全局服务注入：WebSocket 消息总线 + 会话/消息仓库
    app.provide('wsBus', WsBus);
    app.provide('sessionStore', SessionStore);
    app.use(AutoFollow);
    // 注册组件库
    app.component('tool-confirm', ToolConfirm);
    app.component('tool-question', ToolQuestion);
    app.component('confirm-dialog', ConfirmDialog);
    app.component('chat-session-name', ChatSessionName);
    app.component('chat-sidebar', ChatSidebar);
    app.component('file-upload', FileUpload);
    app.component('chat-connection', ChatConnection);
    app.component('auto-resize-textarea', AutoResizeTextarea);
    app.component('command-suggest', CommandSuggest);
    app.component('agent-log-sidebar', AgentLogSidebar);
    app.component('message-topbar', MessageTopbar);
    app.component('message-area', MessageArea);
    app.component('send-area', SendArea);

    app.use(ElementPlus);
    // 自定义指令（放在 ElementPlus 之后注册，确保同名指令以自定义实现为准）
    app.use(InfiniteScrollDirective);
    app.mount('#app');
</script>
</body>
</html>
