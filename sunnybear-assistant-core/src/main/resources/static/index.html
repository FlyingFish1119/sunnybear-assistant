<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">

    <!-- ============================================================
         加载态：铃铛 + 光。零外部依赖，必须放在 head 最前面。
         为什么在这儿：head 后面那批同步脚本（element-plus / vue / mermaid …）
         加起来 5MB 出头，会把 HTML 解析堵住好几秒。在它们之前如果不先把
         背景和骨架定下来，用户看到的就是一片死白。
         · html 自己铺暖光底 → 脚本下载期间就有东西看
         · body 解析出 #in-loading 后 → 铃铛和涟漪接上
         颜色全部从 --main-color 派生，主色由紧随其后的内联脚本从
         localStorage 读出，和页面主题保持一致。
         ★ 可调参数集中在 :root 最末几行。
         ============================================================ -->
    <style>
        :root{
            --main-color: lightsalmon;        /* 兜底值，稍后由内联脚本覆盖为缓存主色 */

            /* 底色：主色混出的暖白，中心亮、四周淡 */
            --inl-tint-a: color-mix(in srgb, var(--main-color) 15%, #FFFFFF);
            --inl-tint-b: color-mix(in srgb, var(--main-color) 5%,  #FFFDFB);
            --inl-tint-c: #FFFCFA;

            /* 柔光与涟漪 */
            --inl-glow: color-mix(in srgb, var(--main-color) 38%, transparent);
            --inl-ring: color-mix(in srgb, var(--main-color) 52%, transparent);

            /* 铃铛：主色可能很浅（lightsalmon 就是），压一点深棕才立得住 */
            --inl-mark:    color-mix(in srgb, var(--main-color) 84%, #43332B);
            --inl-mark-sh: color-mix(in srgb, var(--main-color) 38%, transparent);

            /* ---- 可调参数 ---- */
            --inl-beat: 2.4s;                     /* 统一呼吸周期：光 / 铃铛 / 涟漪共用一个节拍 */
            --inl-halo-size: min(56vmin, 460px);  /* 柔光与涟漪的直径 */
            --inl-mark-size: min(20vmin, 112px);  /* 铃铛宽度 */
        }

        /* 兜底底色挂在 html 上：head 里的同步脚本还没下完、body 还没解析时，
           用户看到的就是这一层暖光，而不是白屏。 */
        html{
            height: 100%;
            background: radial-gradient(circle at 50% 46%,
                        var(--inl-tint-a) 0%, var(--inl-tint-b) 32%, var(--inl-tint-c) 64%) #FFFCFA;
        }

        #in-loading{
            position: fixed;
            inset: 0;
            z-index: 9999;              /* 必须压过 #app —— 它也是 fixed，且在 DOM 里更靠后 */
            transition: opacity .28s ease;
        }
        #in-loading .inl-stage{
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding-bottom: 6vh;        /* 内容整体抬高，让视觉中心和光源对齐 */
            overflow: hidden;
            animation: inl-stage-in .24s ease-out both;
        }
        #in-loading .inl-stage > *{ grid-area: 1 / 1; }

        /* ---- 1. 柔光：整个画面的光源 ---- */
        #in-loading .inl-halo{
            width: var(--inl-halo-size);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle, var(--inl-glow) 0%, transparent 60%);
            animation: inl-halo-breathe var(--inl-beat) ease-in-out infinite;
        }

        /* ---- 2. 涟漪：从中心极小的点荡开，一路淡出去 ----
           两个坑记在这儿，别再踩：
           a) 起点 scale 必须够小，否则第一帧就是个凭空出现的大圈；
           b) 环带宽度是跟着 transform:scale 一起放大的 ——
              色标拉太宽（比如 70%~100%）时，扩散后期环带能粗到 130px+，变成大胖圈。
              所以色标收到 86%、扩散上限压到 .58，让它在小范围里荡。
           （实际最大直径 = 460px × .58 ≈ 267px，环带约占半径的 14%） */
        #in-loading .inl-ring{
            width: var(--inl-halo-size);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(closest-side,
                        transparent 86%,
                        var(--inl-ring) 95%,
                        transparent 100%);
            /* backwards 是关键，别删：r2 要延迟半个周期才起跑，没有它的话，
               延迟期间元素会脱掉动画效果「裸奔」—— opacity:1、未缩放，
               就是一个 460px 的完整大圆凭空杵在那儿，然后突然开始播动画缩小消失。 */
            opacity: 0;
            animation: inl-ripple var(--inl-beat) linear infinite backwards;
        }
        #in-loading .inl-r2{ animation-delay: calc(var(--inl-beat) / 2); }

        /* ---- 3. 铃铛 ---- */
        #in-loading .inl-core{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #in-loading .inl-mark{
            width: var(--inl-mark-size);
            height: auto;
            fill: var(--inl-mark);
            filter: drop-shadow(0 8px 20px var(--inl-mark-sh));
            animation: inl-mark-in .34s cubic-bezier(.34,1.4,.5,1) both,
                       inl-mark-breathe var(--inl-beat) ease-in-out .34s infinite;
        }

        @keyframes inl-stage-in{
            from{ opacity: 0; }
            to  { opacity: 1; }
        }
        @keyframes inl-halo-breathe{
            0%, 100%{ opacity: .62; transform: scale(1); }
            50%     { opacity: 1;   transform: scale(1.05); }
        }
        @keyframes inl-ripple{
            0%  { transform: scale(.05); opacity: 0; }
            10% { opacity: .5; }
            48% { opacity: 0; }
            100%{ transform: scale(.58); opacity: 0; }
        }
        @keyframes inl-mark-in{
            from{ opacity: 0; transform: scale(.86); }
            to  { opacity: 1; transform: scale(1); }
        }
        @keyframes inl-mark-breathe{
            0%, 100%{ transform: scale(1); }
            50%     { transform: scale(1.035); }
        }

        /* 系统开了「减少动态效果」→ 只留静态画面 */
        @media (prefers-reduced-motion: reduce){
            #in-loading .inl-stage{ animation: none; }
            #in-loading .inl-halo,
            #in-loading .inl-mark{ animation: none !important; opacity: 1; }
            #in-loading .inl-ring{ display: none; }
        }
    </style>

    <!-- 主页面布局补偿：左侧多了一条 56px 的导航轨（nav-rail），
         侧边栏相应收窄，让「竖轨 + 侧边栏」的总宽跟改动前落在同一条线上。
         只覆盖主页面 —— 插件页（plug/character、plug/world）没有竖轨，
         继续吃 css/layout.css 里 :root 的 300px 默认值。 -->
    <style>
        #app{
            --sidebar-width: 244px;    /* 300px（原侧边栏） − 56px（导航轨） */
        }

        /* 移动端导航轨隐藏（见 nav-rail.css），抽屉恢复原本的宽度 */
        @media (max-width: 768px){
            #app{
                --sidebar-width: 300px;
            }
        }
    </style>

    <script>
        /* 把缓存主色提到 --main-color 上，越早越好：加载态的背景、柔光、铃铛
           全都从它派生，晚了就会先闪一下默认色。
           必须写在这儿 —— 再往后放就失效了：theme-color.js 只在
           「--main-color 还没有值」时才去读缓存，而上一段 :root 已经给了
           兜底值 lightsalmon，它会以为已经有人管了，直接跳过。 */
        (function () {
            try {
                var c = localStorage.getItem('assistant-mainColor');
                if (c) document.documentElement.style.setProperty('--main-color', c);
            } catch (e) {}
        })();
    </script>

<body>
<div id="in-loading">
    <div class="inl-stage">
        <div class="inl-halo"></div>
        <div class="inl-ring inl-r1"></div>
        <div class="inl-ring inl-r2"></div>

        <div class="inl-core">
            <!-- 看板熊脖子上的那只圆铃铛（不是服务铃那种钟形）：
                 正圆铃身 + 中间一道腰缝 + 底部钥匙孔形发声口 + 顶部椭圆吊耳，全部 evenodd 挖空。
                 拆成两个 path 是有原因的：evenodd 下同一 path 内子路径重叠处会被挖空，
                 而吊耳本来就要压在铃身上、故意重叠，所以必须分开画。 -->
            <svg class="inl-mark" viewBox="0 0 120 120" aria-hidden="true">
                <g transform="rotate(-10 60 60)">
                    <!-- 铃身：正圆挖掉腰缝与底部发声口。
                         发声口的槽必须收在球体内部（槽底 y=107，球底 y=108），
                         写到 118 的话多出的那截会戳出球外，像球上插了根棍子。 -->
                    <path fill-rule="evenodd" d="M60 24a42 42 0 1 1 0 84a42 42 0 1 1 0-84ZM18 66h84v4H18ZM55 107V88a5 5 0 1 1 10 0v19Z"/>
                    <!-- 顶部吊耳：椭圆环 -->
                    <path fill-rule="evenodd" d="M60 6a11 12 0 1 1 0 24a11 12 0 1 1 0-24ZM60 12.5a5 5.5 0 1 1 0 11a5 5.5 0 1 1 0-11Z"/>
                </g>
            </svg>
        </div>
    </div>
</div>
<div id="app">
    <nav-rail :main-color="mainColor" :active-key="railActiveKey" @select="onRailSelect"></nav-rail>
    <chat-sidebar
        :main-color="mainColor"
        :collapsed="sidebarCollapsed"
        @toggle-collapsed="sidebarCollapsed = !sidebarCollapsed"
    ></chat-sidebar>
    <div class="message-area-wrapper" :class="{ 'expanded': sidebarCollapsed }">
        <!-- 拖拽上传遮罩 -->
        <div class="drag-overlay" v-show="dragOver">
            <div :style="{'--main-color': mainColor}" class="drag-overlay-content">
                <i data-lucide="upload-cloud"></i>
                <span>释放文件以上传</span>
            </div>
        </div>
        <div class="message-area-background" :style="backgroundStyle"></div>
        <message-topbar
            :main-color="mainColor"
            :ws-url="wsUrl"
            :context-token-limit="userSettings.contextTokenLimit"
        ></message-topbar>
        <message-area
            :main-color="mainColor"
            :user-settings="userSettings"
            :assistant-settings="assistantSettings"
        ></message-area>
        <agent-log-sidebar :main-color="mainColor"></agent-log-sidebar>
        <send-area
            ref="sendArea"
            :main-color="mainColor"
            @drag-over-change="isChange => dragOver = isChange"
        ></send-area>
        <!-- 看板熊（阳阳）：独立组件，Teleport 到发送区输入卡上。
             必须放在 send-area 之后 —— Teleport 的目标得先存在 -->
        <mascot :main-color="mainColor"></mascot>
    </div>
    <!-- 导航轨面板：由 RailPlugins 注册表驱动（定义在 nav-rail.js、注册在本文件末尾），
         v-for 动态挂载 + 函数 ref 收集实例；面板互斥见 onRailSelect/closeRailPanels -->
    <component v-for="panel in railPanels"
               :key="panel.key"
               :is="panel.component"
               :ref="el => setRailPanelRef(panel.key, el)"
               :main-color="mainColor"
               @visible-change="onPanelVisible(panel.key, $event)"
    ></component>
</div>

<script>
    // 面板与按钮由 RailPlugins 注册表驱动（定义在 nav-rail.js、注册在本文件末尾），
    // 实例经函数 ref 收进 app 实例的 railPanelRefs，互斥逻辑见 onRailSelect/closeRailPanels。

    const app = Vue.createApp({
        data() {
            return {
                mainColor: (window.ThemeColorCache && window.ThemeColorCache.get()) || "lightsalmon",
                userSettings: { background: '', opacity: 0.3 },
                assistantSettings: { avatar: '', assistantName: '' },
                // 标记 app 是否已完成加载并可见，避免在 #app display:none 期间
                // 设置 background-image 导致浏览器跳过图片请求
                loaded: false,

                // 桌面端侧边栏折叠
                sidebarCollapsed: false,
                // 导航轨高亮：跟着「当前打开的面板」走，不是「最后点过的按钮」
                railActiveKey: '',
                // 拖拽上传悬停状态（由发送区组件上抛，控制消息区遮罩）
                dragOver: false,
            }
        },

        computed : {
            wsUrl: function () {
                return API.ws.url
            },
            /** 导航轨面板清单：注册表里带 component 的项（纯按钮不挂载） */
            railPanels() {
                return RailPlugins.snapshot().filter(e => e.component);
            },
            backgroundStyle() {
                const bg = this.userSettings.background;
                // loaded 为 false 时 #app 仍是 display:none，
                // 此时设置 background-image 浏览器不会发起请求
                if (!bg || !this.loaded) return { display: 'none' };
                // 如果不是 http(s) 协议，则走服务端本地文件代理
                let url = bg;
                if (!/^https?:\/\//i.test(bg)) {
                    url = API.fileProxyUrl(bg);
                }
                return {
                    backgroundImage: "url('" + url + "')",
                    opacity: this.userSettings.opacity != null ? this.userSettings.opacity : 0.3
                };
            },
        },

        watch: {
            // 主题色写到根元素，才能覆盖 teleport 到 body 的 Element Plus 组件
            mainColor: {
                handler(val) {
                    document.documentElement.style.setProperty('--main-color', val);
                    document.documentElement.style.setProperty('--el-color-primary', val);
                },
                immediate: true
            }
        },

        inject: ['sessionStore'],

        methods: {

            /**
             * 导航轨按钮分发。
             * 面板之间互斥：点别的按钮先把当前这个收掉 —— 否则终端还开着、
             * 高亮却跑到另一个按钮上，眼睛看着就是对不上的。
             */
            onRailSelect(key) {
                const panel = this.railPanelRefs && this.railPanelRefs[key];
                if (!panel) {
                    return;   // 注册表里没有面板（或还没挂上）：什么都不做
                }
                this.closeRailPanels(key);
                panel.toggle();
            },

            /** 收起导航轨上除 exceptKey 之外的面板（面板互斥） */
            closeRailPanels(exceptKey) {
                const refs = this.railPanelRefs || {};
                Object.keys(refs).forEach(panelKey => {
                    if (panelKey === exceptKey) return;
                    const panel = refs[panelKey];
                    if (panel && panel.visible) panel.close();
                });
            },

            /**
             * 动态面板的函数 ref：按注册 key 把实例收进 this.railPanelRefs。
             * 不放 data —— 实例只在方法里按 key 取，不参与渲染，免得被包成响应式。
             */
            setRailPanelRef(key, el) {
                if (!this.railPanelRefs) this.railPanelRefs = Object.create(null);
                if (el) {
                    this.railPanelRefs[key] = el;
                } else {
                    delete this.railPanelRefs[key];
                }
            },

            /**
             * 面板自己也会被关（ESC / 叉 / 点遮罩），高亮得由它回灌，
             * 不能只在点导航轨的时候算一次。
             */
            onPanelVisible(key, visible) {
                if (visible) {
                    this.railActiveKey = key;
                } else if (this.railActiveKey === key) {
                    this.railActiveKey = '';
                }
            },

            inLoading() {
                document.getElementById("app").style.display = "none";
                var loadingEl = document.getElementById("in-loading");
                loadingEl.style.display = "block";
                loadingEl.style.opacity = "1";          // 复位，供二次进入加载态
                loadingEl.style.pointerEvents = "";     // 同上
            },

            outLoading() {
                // 加载态淡出，同时 #app 从 50dvw 向外展开 —— 两边交叉着走，
                // 中间不会闪出一帧空白。（淡出时长写在内联样式的 transition 里）
                var loadingEl = document.getElementById("in-loading");
                loadingEl.style.opacity = "0";
                loadingEl.style.pointerEvents = "none";
                setTimeout(function () { loadingEl.style.display = "none"; }, 300);
                let appStyle = document.getElementById("app").style;
                appStyle.transition = "all 0.5s ease";
                appStyle.opacity = "0";
                appStyle.width = "50dvw";
                appStyle.display = "flex";
                // 此时 #app 已可见，通知 Vue 可以设置 background-image 了
                // 这样浏览器才会真正发起背景图请求
                this.loaded = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        appStyle.transition = "all 1s ease";
                        appStyle.opacity = "1";
                        appStyle.width = "100dvw";
                    })
                });
            },

            async init() {
                this.inLoading();
                // 两个请求互不依赖，并行发；串行等于白等一个来回
                await Promise.all([
                    this.fetchUserSettings(),
                    this.fetchAssistantSettings()
                ]);
                this.outLoading();
            },

            async fetchUserSettings() {
                try {
                    const result = await API.settings.user.get();
                    if (result.status === 200) {
                        this.userSettings = result.data || { background: '', opacity: 0.3 };
                        // 从服务端获取主题色，并刷新本地缓存（下次加载先用缓存，避免闪默认色）
                        if (this.userSettings.mainColor) {
                            this.mainColor = this.userSettings.mainColor;
                            if (window.ThemeColorCache) window.ThemeColorCache.set(this.userSettings.mainColor);
                        }
                    }
                } catch (error) {
                    console.error('获取用户设置失败:', error);
                }
                // 服务端没有则回退到 localStorage
                if (!this.userSettings.mainColor) {
                    try {
                        const saved = localStorage.getItem('assistant-mainColor');
                        if (saved) {
                            this.mainColor = saved;
                        }
                    } catch (e) {}
                }
            },

            async fetchAssistantSettings() {
                try {
                    const result = await API.settings.assistant.get();
                    if (result.status === 200) {
                        this.assistantSettings = result.data || { avatar: '', assistantName: '' };
                    }
                } catch (error) {
                    console.error('获取助手设置失败:', error);
                }
            },

            /* ========== TTS 语音朗读（实际播放逻辑在发送区组件内） ========== */

            /** 当前语音朗读开关状态（发送区组件持有，供 replace/edit 请求复读开关） */
            currentTtsEnabled() {
                return this.$refs.sendArea ? this.$refs.sendArea.isTtsEnabled() : false;
            },

            /** 清空播放队列并停掉当前音频（停止/切会话/新轮/发新消息时调用） */
            clearTtsQueue() {
                if (this.$refs.sendArea) {
                    this.$refs.sendArea.clearTtsQueue();
                }
            },

            /**
             * 滚动消息列表到底部
             * @param {boolean} force - 为 true 时无视 _autoFollowPaused 强制滚动
             */
            scrollToBottom(force = false) {
                if (!force) {
                    var listEl = document.querySelector('.message-area-list');
                    if (listEl && listEl._autoFollowPaused) return;
                }
                this.$nextTick(() => {
                    requestAnimationFrame(() => {
                        var el = document.querySelector('.message-area-list');
                        if (el) {
                            el.scrollTop = el.scrollHeight;
                        }
                    });
                });
            },

            /**
             * 使用 requestAnimationFrame 合并图标刷新，避免流式传输时频繁全量扫描 DOM
             */
            _scheduleIconRefresh() {
                if (this._iconRefreshScheduled) return;
                this._iconRefreshScheduled = true;
                requestAnimationFrame(() => {
                    lucide.createIcons();
                    this._iconRefreshScheduled = false;
                });
            },

        },

        mounted() {
            lucide.createIcons();
            // 注册 SessionStore 的 UI 副作用钩子（DOM / TTS），数据与 UI 解耦
            this.sessionStore.registerUi({
                scrollToBottom: (force) => this.scrollToBottom(force),
                renderMermaid: () => MermaidUtils.renderAll(),
                clearTts: () => this.clearTtsQueue(),
                enqueueTts: (audio) => { if (this.$refs.sendArea) this.$refs.sendArea.enqueueTtsAudio(audio); },
                playMessageAudio: (msg) => { if (this.$refs.sendArea) this.$refs.sendArea.playMessageAudio(msg); },
                isTtsEnabled: () => this.currentTtsEnabled(),
                clearMdCache: () => this.$md.clearCache(),
                clearSendArea: () => { if (this.$refs.sendArea) this.$refs.sendArea.clear(); }
            });
            this.init();
        },

        updated() {
            this._scheduleIconRefresh();
        },
    });

    // 注册全局工具 & 指令
    app.config.globalProperties.$fileUrl = FileUrlUtils;
    app.config.globalProperties.$md = MarkdownUtils;
    // 全局服务注入：WebSocket 消息总线 + 会话/消息仓库
    app.provide('wsBus', WsBus);
    app.provide('sessionStore', SessionStore);
    app.use(AutoFollow);
    // 注册组件库
    app.component('tool-confirm', ToolConfirm);
    app.component('tool-question', ToolQuestion);
    app.component('confirm-dialog', ConfirmDialog);
    app.component('chat-session-name', ChatSessionName);
    app.component('chat-sidebar', ChatSidebar);
    app.component('nav-rail', NavRail);
    app.component('file-upload', FileUpload);
    app.component('chat-connection', ChatConnection);
    app.component('auto-resize-textarea', AutoResizeTextarea);
    app.component('command-suggest', CommandSuggest);
    app.component('agent-log-sidebar', AgentLogSidebar);
    app.component('message-topbar', MessageTopbar);
    app.component('message-area-group', MessageAreaGroup);
    app.component('message-area-user', MessageAreaUser);
    app.component('message-area-assistant', MessageAreaAssistant);
    app.component('message-area-tool', MessageAreaTool);
    app.component('message-area-hero', MessageAreaHero);
    app.component('message-area-compress', MessageAreaCompress);
    app.component('message-area-tokens', MessageAreaTokens);
    app.component('message-area-text', MessageAreaText);
    app.component('message-area', MessageArea);
    app.component('send-area', SendArea);
    app.component('mascot', Mascot);
    app.component('mark-tracker', MarkTracker);
    app.component('session-files', SessionFiles);
    app.component('memory-panel', MemoryPanel);
    app.component('knowledge-panel', KnowledgePanel);
    app.component('shell-panel', ShellPanel);

    /**
     * 导航轨注册：一条同时接通「按钮 + 面板挂载 + 互斥开合」，
     * 以后加面板 = 这里加一行（组件实现 toggle()/close() 与 visible、并发 visible-change 即可）。
     * order 决定轨上按钮顺序：会话文件 → 记忆 → 知识库 → 命令。
     */
    RailPlugins.register('files',    { icon: 'folder-open',    label: '会话文件', component: SessionFiles,    order: 10 });
    RailPlugins.register('memory',   { icon: 'brain',          label: '记忆',     component: MemoryPanel,     order: 20 });
    RailPlugins.register('knowledge',{ icon: 'database',       label: '知识库',   component: KnowledgePanel,  order: 30 });
    RailPlugins.register('shell',    { icon: 'chevrons-right', label: '命令',     component: ShellPanel,      order: 40 });

    app.use(ElementPlus);
    // 自定义指令（放在 ElementPlus 之后注册，确保同名指令以自定义实现为准）
    app.use(InfiniteScrollDirective);
    app.mount('#app');

    // 注册 Service Worker（PWA 安装 / 独立窗口）
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) => {
                console.error('Service Worker 注册失败:', err);
            });
        });
    }
</script>
</body>
</html>
