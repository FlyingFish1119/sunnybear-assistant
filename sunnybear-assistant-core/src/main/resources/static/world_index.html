<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
    <title>群聊 — SunnyBear 助手</title>
    <link rel="icon" type="image/png" href="icon/ComfyUI_23337_.png">
    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="lib/element-plus.css">
    <!-- Vue 3 -->
    <script src="lib/vue.global.prod.js"></script>
    <!-- Element Plus 组件库 -->
    <script src="lib/element-plus.full.min.js"></script>
    <!-- lucide 图标 -->
    <script src="lib/lucide.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="lib/katex.min.css">
    <script src="lib/katex.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="lib/mermaid.min.js"></script>
    <!-- 项目本地封装 -->
    <script src="api.js"></script>
    <script src="utils/render-markdown.js"></script>
    <script src="utils/color.js"></script>
    <script src="utils/mermaid.js"></script>
    <script src="utils/file-url.js"></script>
    <script src="directives/auto-follow.js"></script>
    <script src="components/tool-confirm/tool-confirm.js"></script>
    <script src="components/confirm-dialog/confirm-dialog.js"></script>
    <script src="components/session-name/session-name.js"></script>
    <script src="components/world-sidebar/world-sidebar.js"></script>
    <script src="components/file-upload/file-upload.js"></script>
    <script src="components/connection-indicator/connection-indicator.js"></script>
    <script src="components/auto-resize-textarea/auto-resize-textarea.js"></script>
    <script src="components/command-suggest/command-suggest.js"></script>
    <!-- 样式 -->
    <link rel="stylesheet" href="css/scrollbar.css"/>
    <link rel="stylesheet" href="css/layout.css"/>
    <!-- 三大板块样式：侧边栏 | 消息栏 | 发送栏 -->
    <link rel="stylesheet" href="components/world-sidebar/world-sidebar.css"/>
    <link rel="stylesheet" href="css/message-area.css"/>
    <link rel="stylesheet" href="components/session-name/session-name.css"/>
    <link rel="stylesheet" href="css/send-area.css"/>
    <link rel="stylesheet" href="components/file-upload/file-upload.css"/>
    <link rel="stylesheet" href="css/markdown.css"/>
    <link rel="stylesheet" href="components/tool-confirm/tool-confirm.css"/>
    <link rel="stylesheet" href="components/confirm-dialog/confirm-dialog.css"/>
    <link rel="stylesheet" href="components/connection-indicator/connection-indicator.css"/>
    <link rel="stylesheet" href="components/auto-resize-textarea/auto-resize-textarea.css"/>
    <link rel="stylesheet" href="components/command-suggest/command-suggest.css"/>
    <!-- highlight.js 代码高亮样式 -->
    <link rel="stylesheet" href="lib/highlight-github-dark.min.css">
    <style>
        /* 私聊标签块：默认折叠为通用文本，点击展开具体内容 */
        .private-chat-block {
            border: 1px dashed rgba(128, 128, 128, 0.5);
            border-radius: 8px;
            padding: 6px 10px;
            margin: 4px 0;
            background: rgba(128, 128, 128, 0.08);
            cursor: pointer;
            user-select: none;
        }
        .private-chat-block-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
        }
        .private-chat-lock { font-size: 12px; }
        .private-chat-chevron {
            margin-left: auto;
            font-size: 10px;
            transition: transform 0.2s;
        }
        .private-chat-chevron.expanded { transform: rotate(180deg); }
        .private-chat-block-content {
            margin-top: 6px;
            cursor: auto;
            user-select: text;
        }
        /* 独白块（<private> 无 to）：暖色提示，与私聊区分 */
        .private-chat-block.monologue {
            border-color: rgba(250, 140, 22, 0.45);
            background: rgba(250, 140, 22, 0.06);
        }
        /* 发言权移交提示：<switch to:"X"> 渲染成靠左的轻提示 */
        .switch-chat-hint {
            text-align: left;
            font-size: 12px;
            color: #aaa;
            padding: 2px 0;
            user-select: none;
        }

        /* 私聊浮条：悬浮在发送栏上方、与发送栏等宽（复用 command-suggest 浮层风格） */
        .private-chat-panel {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 600px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 10px 12px;
            z-index: 500;
            box-sizing: border-box;
        }
        .private-chat-panel-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .private-chat-panel-body {
            margin-top: 8px;
        }
        .private-chat-panel-label {
            font-size: 13px;
            font-weight: 600;
            color: #606266;
            white-space: nowrap;
        }
        .private-chat-panel-input {
            flex: 1;
            min-width: 0;
            padding: 6px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .private-chat-panel-input:focus { border-color: var(--main-color); }
        .private-chat-panel-btn {
            padding: 7px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .private-chat-panel-btn { background: #f5f5f5; color: #666; }
        .private-chat-panel-btn:hover { background: #e8e8e8; color: #303133; }
        .private-chat-panel-btn-primary { background: var(--main-color); color: #fff; }
        .private-chat-panel-btn-primary:hover { filter: brightness(1.06); }
        /* 私聊/独白 类型切换按钮 */
        .private-chat-mode-btn {
            padding: 4px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            background: #fff;
            color: #606266;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .private-chat-mode-btn.active {
            background: var(--main-color);
            border-color: var(--main-color);
            color: #fff;
        }
        .private-chat-mode-btn:not(.active):hover {
            border-color: var(--main-color);
            color: var(--main-color);
        }
        .private-chat-panel-close {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        /* 私聊按钮展开态：面板显示时按钮压暗 */
        .send-area-attach-button.panel-open {
            filter: brightness(0.85);
        }
        @media (max-width: 768px) {
            .private-chat-panel-row {
                flex-wrap: wrap;
            }
            .private-chat-panel-input {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
<div id="in-loading">
</div>
<div id="app" :style="{'--main-color': mainColor, '--bg-user': userBubbleBg}">
    <world-sidebar ref="sidebar"
        :current-session="currentSession"
        :main-color="mainColor"
        :collapsed="sidebarCollapsed"
        :world-id="worldId"
        @select-session="selectSession"
        @create-session="createSession"
        @on-delete-session="onDeleteSession"
        @toggle-collapsed="sidebarCollapsed = !sidebarCollapsed"
    ></world-sidebar>
    <div class="message-area-wrapper" :class="{ 'expanded': sidebarCollapsed }">
        <!-- 拖拽上传遮罩 -->
        <div class="drag-overlay" v-show="dragOver">
            <div :style="{'--main-color': mainColor}" class="drag-overlay-content">
                <i data-lucide="upload-cloud"></i>
                <span>释放文件以上传</span>
            </div>
        </div>
        <div class="message-area-background" :style="backgroundStyle"></div>
        <div class="message-area-top">
            <div style="display: flex; align-items: center; gap: 6px; min-width: 0;">
                <button class="sidebar-toggle-btn" @click="toggleSidebar" title="展开/收起侧边栏">
                    <i data-lucide="menu" style="width: 18px; height: 18px;"></i>
                </button>
                <session-name
                    :current-session="currentSession"
                    :main-color="mainColor"
                    @update-session-name="n => currentSession.name = n">
                </session-name>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <connection-indicator
                    :ws-url="wsUrl"
                    @connected="onWsConnect($event)"
                    @disconnected="sending = false; ws = null">
                </connection-indicator>
            </div>
        </div>
        <div class="message-area-panel" :class="{ 'is-new-chat': !currentSessionId && currentMessages.length === 0 }">
            <!-- 新对话时的问候语横幅 -->
            <div v-if="!currentSessionId && currentMessages.length === 0" class="greeting-banner" :style="{'--main-color': mainColor}">
                <template v-if="worldInfo">
                    <i data-lucide="users" class="greeting-icon"></i>
                    <span>{{ worldInfo.name }} · {{ greetingText || '输入内容开始群聊' }}</span>
                </template>
                <template v-else>
                    <i data-lucide="users" class="greeting-icon"></i>
                    <span>请先选择一个世界观开始群聊</span>
                </template>
            </div>
            <!-- 消息列表：新对话时隐藏 -->
            <div v-show="currentSessionId || currentMessages.length > 0" class="message-area-list" v-auto-follow>
                <div :style="{'--main-color': mainColor}" class="message-area-list-loading" v-if="sessionSelectLoading">
                    <div class="loading-spinner">
                        <i data-lucide="loader-circle" class="loading-icon"></i>
                    </div>
                    <span class="loading-text">加载中</span>
                    <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
                </div>
                <div v-for="msg in currentMessages" :key="msg.id" :class="['message-area-row', msg.role]">
                    <div v-if="msg.role !== 'tool'" class="message-area-col">
                        <!-- 头像 + 名称时间 同一行 -->
                        <div class="message-header-row">
                            <img v-if="getMessageAvatar(msg)"
                                 :src="getMessageAvatar(msg)"
                                 class="message-avatar-top"
                                 :alt="msg.name + '头像'"
                                 @error="msg.role === 'user' ? userAvatarError = true : assistantAvatarError = true">
                            <div v-else class="message-avatar-top message-avatar-default"
                                 :class="msg.role === 'user' ? 'user-avatar-default' : 'assistant-avatar-default'">
                                <span>{{ getAvatarInitial(msg) }}</span>
                            </div>
                            <span class="message-header-meta">{{ msg.name }} · {{ msg.createTime }}</span>
                        </div>
                        <div class="message-area-bubble" :style="msg.role === 'user' ? {'background-color': userBubbleBg} : {}">
                            <div v-if="msg.reasoningContent !== null && msg.reasoningContent.length > 0">
                                <div class="message-area-bubble-meta reasoning-header" @click="toggleCollapse(msg.id, 'thinking')">
                                    <i style="width: 10px; height: 10px" data-lucide="sparkle"></i>
                                    <span>思考过程:</span>
                                    <span v-if="isThinkingMsg(msg)" class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>
                                    <i :class="['reasoning-chevron', { collapsed: isCollapsed(msg.id, 'thinking') }]" style="width: 14px; height: 14px" data-lucide="chevron-down"></i>
                                </div>
                                <div :class="['collapsible-content', { collapsed: isCollapsed(msg.id, 'thinking') }]" :data-collapse-key="msg.id + '_thinking'">
                                    <div class="message-area-reasoning markdown-body" v-html="$md.render(msg.reasoningContent)"></div>
                                </div>
                            </div>
                            <!-- 编辑模式：显示 textarea -->
                            <div v-if="currentEditId === msg.id">
                                <auto-resize-textarea
                                    class="message-edit-textarea"
                                    :main-color="mainColor"
                                    v-model="editDraft"
                                    :max-height="300"
                                    :min-height="65"
                                    @submit="editTargetRole === 'assistant' ? confirmAssistantEdit(msg) : confirmEdit(msg)"
                                    @cancel="editTargetRole === 'assistant' ? cancelAssistantEdit() : cancelEdit()"
                                ></auto-resize-textarea>
                            </div>
                            <!-- 正常模式：显示内容 -->
                            <div v-else v-for="(content, idx) in msg.contents" :key="idx">
                                <template v-if="content.type === 'text'">
                                    <!-- 私聊标签段：默认折叠为通用文本，点击展开具体内容 -->
                                    <template v-for="(seg, segIdx) in privateSegments(content.content)" :key="segIdx">
                                        <div v-if="seg.type === 'text'" class="markdown-body" v-html="$md.render(seg.text)"></div>
                                        <div v-else-if="seg.type === 'switch'" class="switch-chat-hint">↪ 将话头交给 {{ seg.to }}</div>
                                        <div v-else class="private-chat-block" :class="{ monologue: seg.monologue }" @click.stop="togglePrivate(msg.id, segIdx, seg)">
                                            <div class="private-chat-block-header">
                                                <span class="private-chat-lock">🔒</span>
                                                <span class="private-chat-meta">{{ seg.monologue ? ('独白 · ' + seg.from) : ('私聊 · ' + seg.from + ' → ' + seg.to) }}</span>
                                                <span class="private-chat-chevron" :class="{ expanded: isPrivateExpanded(msg.id, segIdx, seg) }">▾</span>
                                            </div>
                                            <div v-if="isPrivateExpanded(msg.id, segIdx, seg)" class="private-chat-block-content markdown-body" v-html="$md.render(seg.text)"></div>
                                        </div>
                                    </template>
                                </template>
                                <div v-else-if="content.type === 'image'" class="message-attachment-image">
                                    <img :src="$fileUrl.proxy(content.url)" @click.stop="$fileUrl.previewImage(content.url)" />
                                </div>
                                <div v-else-if="content.type === 'audio'" class="message-attachment-audio">
                                    <audio :src="$fileUrl.proxy(content.url)" controls preload="metadata"></audio>
                                </div>
                                <div v-else-if="content.type === 'video'" class="message-attachment-video">
                                    <video :src="$fileUrl.proxy(content.url)" controls preload="metadata"></video>
                                </div>
                                <div v-else-if="content.type === 'file'" class="message-attachment-file">
                                    <a :href="$fileUrl.proxy(content.url)" target="_blank">
                                        <i data-lucide="file" style="width:18px;height:18px"></i>
                                        <span>{{ $fileUrl.fileName(content.url) }}</span>
                                    </a>
                                </div>
                            </div>
                            <div v-if="msg.toolCalls && msg.toolCalls.length > 0" :class="['tool-calls-block', { collapsed: isCollapsed(msg.id, 'toolcalls') }]">
                                <div class="message-area-bubble-tools-header" @click="toggleCollapse(msg.id, 'toolcalls')">
                                    <i :class="['tool-chevron', { collapsed: isCollapsed(msg.id, 'toolcalls') }]" style="width: 14px; height: 14px" data-lucide="chevron-right"></i>
                                    <span class="markdown-body" v-html="$md.render(msg.toolCalls.map(t => '`' + t.name + '`').join(', '))"></span>
                                </div>
                                <div :class="['message-area-bubble-tools-wrap', { collapsed: isCollapsed(msg.id, 'toolcalls') }]" :data-collapse-key="msg.id + '_toolcalls'">
                                    <div class="message-area-bubble-tools markdown-body" v-html="$md.render(msg.toolCalls.map(t => '```' + t.name + '\n' + (t.arguments ? t.arguments : '') + '\n```').join('\n\n'))">
                                    </div>
                                </div>
                            </div>
                            <!-- streaming 时空占位，防止高度抽搐 -->
                            <div v-if="(msg.siblingCount > 1 || msg.role === 'assistant' || msg.role === 'user') && isStreaming"
                                 class="message-area-bubble-actions" style="visibility: hidden;"></div>
                            <!-- 编辑模式：确认/取消按钮，始终可见 -->
                            <div v-else-if="currentEditId === msg.id" class="message-area-bubble-actions" style="opacity: 1;">
                                <span class="branch-switch-arrow"
                                      @click.stop="editTargetRole === 'assistant' ? confirmAssistantEdit(msg) : confirmEdit(msg)"
                                      title="确认编辑">
                                    <i style="width: 14px; height: 14px" data-lucide="check"></i>
                                </span>
                                <span class="branch-switch-arrow"
                                      @click.stop="editTargetRole === 'assistant' ? cancelAssistantEdit() : cancelEdit()"
                                      title="取消编辑">
                                    <i style="width: 14px; height: 14px" data-lucide="x"></i>
                                </span>
                            </div>
                            <!-- 真实按钮区，当前消息不在编辑模式时显示 -->
                            <div v-else-if="(msg.siblingCount > 1 || msg.role === 'assistant' || msg.role === 'user') && currentEditId !== msg.id" class="message-area-bubble-actions">
                                <span v-if="msg.siblingCount > 1" class="branch-switch-arrow"
                                      :class="{ disabled: msg.siblingIndex === 0 }"
                                      @click.stop="switchBranch(msg, 'left')"
                                      title="切换到上一个分支">
                                    <i style="width: 14px; height: 14px" data-lucide="chevron-left"></i>
                                </span>
                                <span v-if="msg.siblingCount > 1" class="branch-switch-counter">{{ msg.siblingIndex + 1 }} / {{ msg.siblingCount }}</span>
                                <span v-if="msg.siblingCount > 1" class="branch-switch-arrow"
                                      :class="{ disabled: msg.siblingIndex === msg.siblingCount - 1 }"
                                      @click.stop="switchBranch(msg, 'right')"
                                      title="切换到下一个分支">
                                    <i style="width: 14px; height: 14px" data-lucide="chevron-right"></i>
                                </span>
                                <span v-if="msg.role === 'assistant'" class="branch-switch-arrow"
                                      @click.stop="copyMessage(msg)"
                                      title="复制消息">
                                    <i style="width: 14px; height: 14px" data-lucide="copy"></i>
                                </span>
                                <span v-if="msg.role === 'assistant'" class="branch-switch-arrow"
                                      @click.stop="startAssistantEdit(msg)"
                                      title="编辑消息">
                                    <i style="width: 14px; height: 14px" data-lucide="pencil"></i>
                                </span>
                                <span v-if="msg.role === 'user'" class="branch-switch-arrow"
                                      @click.stop="startEdit(msg)"
                                      title="编辑消息">
                                    <i style="width: 14px; height: 14px" data-lucide="pencil"></i>
                                </span>
                                <span v-if="msg.role === 'user'" class="branch-switch-arrow"
                                      @click.stop="copyMessage(msg)"
                                      title="复制消息">
                                    <i style="width: 14px; height: 14px" data-lucide="copy"></i>
                                </span>
                                <span v-if="msg.role === 'user'" class="branch-switch-arrow"
                                      @click.stop="deleteUserMessage(msg)"
                                      title="删除消息">
                                    <i style="width: 14px; height: 14px" data-lucide="trash-2"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div v-else-if="msg.role === 'tool'" class="message-area-bubble">
                        <div class="message-area-bubble-meta tool-meta-header" @click="toggleCollapse(msg.id, 'tool')">
                            <i :class="['tool-chevron', { collapsed: isCollapsed(msg.id, 'tool') }]" style="width: 14px; height: 14px" data-lucide="chevron-right"></i>
                            <span>{{ msg.name }} · {{ msg.createTime }}</span>
                            <span class="tool-status-inline" :style="{color: $toolStatus(msg).color}">
                                <i style="width: 12px; height: 12px" :data-lucide="$toolStatus(msg).icon"></i>
                                <span style="padding-left: 2px">{{ $toolStatus(msg).text }}</span>
                            </span>
                        </div>
                        <div :class="['collapsible-content', { collapsed: isCollapsed(msg.id, 'tool') }]" :data-collapse-key="msg.id + '_tool'">
                            <div v-for="(content, idx) in msg.contents" :key="idx">
                                <div v-if="content.type === 'text'">
                                    <template v-if="msg.extension && msg.extension.status === 'executing'">
                                        <div class="message-area-bubble-tools-meta">
                                            <i style="width: 12px; height: 12px; color: #faad14" data-lucide="circle-dot"></i>
                                            <div style="padding: 0 0 1px 4px; color: #faad14">[{{msg.name}}]执行中…</div>
                                        </div>
                                    </template>
                                    <template v-else>
                                        <span v-if="$toolParsed(content).succeed" class="message-area-bubble-tools-meta">
                                            <i style="width: 12px; height: 12px; color: #52c41a" data-lucide="circle-check"></i>
                                            <span style="padding: 0 0 1px 4px; color: #52c41a">[{{msg.name}}]执行成功</span>
                                        </span>
                                        <div v-else class="message-area-bubble-tools-meta">
                                            <i style="width: 12px; height: 12px; color: #ff4d4f" data-lucide="circle-x"></i>
                                            <div style="padding: 0 0 1px 4px; color: #ff4d4f">[{{msg.name}}]执行失败</div>
                                        </div>
                                        <div class="markdown-body" v-html="$md.render($toolParsed(content).result)"></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="send-area-container" :style="{'--main-color': mainColor}" style="position: relative;">
            <command-suggest
                :commands="filteredCommands"
                :active-index="commandActiveIndex"
                :visible="commandSuggestVisible"
                :main-color="mainColor"
                :sub-options="subOptions"
                :sub-title="'选择一个会话'"
                @select="onCommandSelect"
                @sub-select="onSubSelect"
                @back="onCommandBack"
                @update:active-index="idx => commandActiveIndex = idx"
            ></command-suggest>
            <file-upload ref="fileUpload"
                drop-zone=".message-area-wrapper"
                :files="uploadedFiles"
                :enable-paste="true"
                :main-color="mainColor"
                @update-files="files => uploadedFiles = files"
                @drag-over-change="isChange => dragOver = isChange">
            </file-upload>

            <!-- 发言权移交浮条：悬浮在发送栏上方，选择角色后拼出 <switch to:"X"> 标签 -->
            <div v-show="switchChatPanelVisible" class="private-chat-panel">
                <div class="private-chat-panel-row">
                    <span class="private-chat-panel-label">移交给</span>
                    <el-select v-model="switchChatForm.target" filterable clearable
                        placeholder="选择角色" size="small" style="flex:none;width:200px">
                        <el-option v-for="name in privateChatOptions" :key="name" :label="name" :value="name"></el-option>
                    </el-select>
                    <button class="private-chat-panel-btn private-chat-panel-btn-primary" @click="addSwitchTag">移交</button>
                    <button class="private-chat-panel-btn private-chat-panel-close" @click="closeSwitchChatPanel" title="关闭">
                        <i data-lucide="x" style="width:14px;height:14px"></i>
                    </button>
                </div>
            </div>

            <!-- 私聊浮条：悬浮在发送栏上方居中；点「添加」拼进发送栏（可混合发送），支持传纸条/独白 -->
            <div v-show="privateChatPanelVisible" class="private-chat-panel">
                <div class="private-chat-panel-row">
                    <span class="private-chat-panel-label">类型</span>
                    <button class="private-chat-mode-btn" :class="{ active: privateChatMode === 'whisper' }" @click="privateChatMode = 'whisper'">传纸条</button>
                    <button class="private-chat-mode-btn" :class="{ active: privateChatMode === 'monologue' }" @click="privateChatMode = 'monologue'">独白</button>
                    <button class="private-chat-panel-btn private-chat-panel-close" style="margin-left:auto" @click="closePrivateChatPanel" title="关闭">
                        <i data-lucide="x" style="width:14px;height:14px"></i>
                    </button>
                </div>
                <div class="private-chat-panel-row private-chat-panel-body">
                    <template v-if="privateChatMode === 'whisper'">
                        <span class="private-chat-panel-label">私聊给</span>
                        <el-select v-model="privateChatForm.targets" multiple filterable clearable
                            placeholder="选择角色" size="small" style="flex:none;width:200px">
                            <el-option v-for="name in privateChatOptions" :key="name" :label="name" :value="name"></el-option>
                        </el-select>
                    </template>
                    <span v-else class="private-chat-panel-label">独白</span>
                    <input class="private-chat-panel-input" v-model="privateChatForm.content"
                        :placeholder="privateChatMode === 'whisper' ? '输入私聊内容，回车添加' : '输入内心独白，回车添加'"
                        @keyup.enter="addPrivateMessage" @keyup.esc="closePrivateChatPanel" />
                    <button class="private-chat-panel-btn private-chat-panel-btn-primary" @click="addPrivateMessage">添加</button>
                </div>
            </div>

            <div class="send-area-input-row">
                <button class="send-area-attach-button" @click="$refs.fileUpload.openFilePicker()" title="上传文件">
                    <i data-lucide="paperclip" style="width:18px;height:18px"></i>
                </button>
                <button class="send-area-attach-button" :class="{ 'panel-open': switchChatPanelVisible }" style="border-top-left-radius:0;border-bottom-left-radius:0" @click="toggleSwitchChatPanel" title="发言权移交（switch）">
                    <i data-lucide="arrow-right-left" style="width:18px;height:18px"></i>
                </button>
                <button class="send-area-attach-button" :class="{ 'panel-open': privateChatPanelVisible }" style="border-top-left-radius:0;border-bottom-left-radius:0" @click="togglePrivateChatPanel" title="发起私聊">
                    <i data-lucide="message-square" style="width:18px;height:18px"></i>
                </button>
                <auto-resize-textarea
                    class="send-area-textarea"
                    :main-color="mainColor"
                    v-model="inputText"
                    :placeholder="worldId ? '输入消息，Ctrl+Enter 发送，Enter 换行' : '请先选择一个世界观'"
                    :max-height="180"
                    :min-height="85"
                    @submit="sendMessage"
                    @cancel="onTextareaCancel"
                    @keydown="onTextareaKeydown"
                ></auto-resize-textarea>
                <!-- 这里不要合并两个按钮，否则icon会出现问题 -->
                <button v-if="isStreaming"
                    class="send-area-submit-button"
                    @click="stopStreaming()"
                    :disabled="isStreaming && !currentSessionId"
                >
                    <i style="margin-top: 5px; margin-left: -5px" data-lucide="square"></i>
                </button>
                <button v-else
                        class="send-area-submit-button"
                        @click="sendMessage()"
                        :disabled="!worldId || sending || (!isStreaming && !inputText && uploadedFiles.length === 0)"
                >
                    <i style="margin-top: 5px; margin-left: -5px" data-lucide="send"></i>
                </button>
            </div>
        </div>

        <!-- 工具确认对话框（组件） -->
        <tool-confirm
            ref="toolConfirm"
            :main-color="mainColor">
        </tool-confirm>
    </div>
</div>

<script>
    const Utils = {
        getLast(arr) {
            if (arr === null || arr.length === 0) {
                return null;
            }
            return arr[arr.length - 1];
        },

        getDefaultAssistantMessage(sessionId, parentId) {
            return  {
                id: 'streaming_' + Date.now(),
                sessionId: sessionId,
                parentId: parentId,
                role: 'assistant',
                reasoningContent: "",
                contents: [{
                type: 'text',
                content: ""
            }],
                toolCalls: []
            }
        }
    }

    /* ========== 斜杠指令注册表 ==========
     * 每项: { name, desc, usage, icon }
     * icon 使用 lucide 图标名，见 https://lucide.dev/icons/
     * 添加新指令只需在此数组中追加一项即可，框架自动生效。
     */
    const SLASH_COMMANDS = [
        // TODO 后续构思角色专用指令
    ];

    const app = Vue.createApp({
        data() {
            return {
                mainColor: "lightsalmon",
                userSettings: { background: '', opacity: 0.3 },
                assistantSettings: { avatar: '', assistantName: '' },
                // 世界观群聊相关
                worldId: null,
                worldInfo: null,
                worlds: [],
                // 世界内角色 map（name -> avatar），用于消息气泡头像
                worldCharacters: {},
                userAvatarError: false,
                assistantAvatarError: false,
                // 标记 app 是否已完成加载并可见，避免在 #app display:none 期间
                // 设置 background-image 导致浏览器跳过图片请求
                loaded: false,
                sessionSelectLoading: false,
                ws: null,
                chatModel: null,

                // 输入框内容
                inputText: '',
                // 已发送但尚未收到服务端 init_user 确认 —— 防止窗口期内重复点击发送重复消息
                sending: false,
                // 当前正在处理的 session，对象应该直接引用 sessions 里的对象
                currentSession: {},
                // 当前正在展示的 messages
                currentMessages: [],
                // 流式标记表：key = sessionId，各会话只看自己的标记，互不影响
                // （在途占位消息以 streaming_ 前缀标识，直接驻留在 currentMessages）
                streamingMap: {},
                // 当前正在处理的 tool call id
                currentToolCallId: null,

                // 消息编辑状态
                currentEditId: null,
                editDraft: '',
                editTargetRole: null,
                // 问候语
                greetingText: '',
                // 桌面端侧边栏折叠
                sidebarCollapsed: false,
                // 折叠状态：key = msgId_section, value = true(折叠)/false(展开)
                collapsedState: {},
                // 文件上传
                // 斜杠指令候选
                commandActiveIndex: 0,
                commandSubMode: null,
                commandParentCmd: null,
                uploadedFiles: [],   // [{name, data}] — 对应后端 FileData
                dragOver: false,
                // 私聊内容展开状态：key = msgId_segIdx
                expandedPrivate: {},
                // 私聊浮条
                privateChatPanelVisible: false,
                privateChatMode: 'whisper', // 'whisper' 传纸条 | 'monologue' 独白
                privateChatForm: { targets: [], content: '' },
                // 发言权移交浮条
                switchChatPanelVisible: false,
                switchChatForm: { target: '' },
                worldCharacterList: [],
            }
        },

        computed : {
            wsUrl: function () {
                return API.ws.worldUrl;
            },
            isNewSession() {
                return this.currentSessionId === undefined;
            },
            currentSessionId () {
                return this.currentSession.id;
            },
            // 当前会话是否正在流式：只查当前会话自己的标记，其他会话的 START/END 不会互相影响
            isStreaming() {
                return !!this.streamingMap[this.currentSessionId];
            },
             greetingIcon() {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 12) return 'sunrise';
                if (hour >= 12 && hour < 18) return 'sun';
                if (hour >= 18 && hour < 22) return 'sunset';
                return 'moon';
            },
            // 斜杠指令候选面板是否可见
            commandSuggestVisible() {
                if (this.commandSubMode && this.subOptions.length > 0) return true;
                return this.inputText.startsWith('/') && this.filteredCommands.length > 0;
            },
            // 根据当前输入过滤匹配的指令
            filteredCommands() {
                if (!this.inputText || !this.inputText.startsWith('/')) return [];
                const lower = this.inputText.toLowerCase().split(' ')[0];
                return SLASH_COMMANDS.filter(c => c.name.startsWith(lower) || c.name.includes(lower));
            },
            // 二级选项（如会话列表）
            subOptions() {
                if (this.commandSubMode === 'sessions') {
                    const sessions = this.$refs.sidebar ? (this.$refs.sidebar.sessions || []) : [];
                    return sessions.map(s => ({
                        id: s.id,
                        label: s.name || s.id,
                        desc: ''
                    }));
                }
                return [];
            },
            // 用户消息气泡背景色：跟随主色自动变浅
            userBubbleBg() {
                return ColorUtils.lighten(this.mainColor, 0.25);
            },
            // 私聊可选对象：世界内角色名（排除玩家夺舍的自身；旁白启用时可选）
            privateChatOptions() {
                const possess = this.worldInfo && this.worldInfo.possessName;
                const options = (this.worldCharacterList || [])
                    .map(c => c.name)
                    .filter(n => n && n !== possess);
                if (this.worldInfo && this.worldInfo.narrationEnable !== false) {
                    options.push('旁白');
                }
                return options;
            },
            backgroundStyle() {
                // 世界观背景优先；未设置时回退到用户设置背景
                const bg = (this.worldInfo && this.worldInfo.background) || this.userSettings.background;
                // loaded 为 false 时 #app 仍是 display:none，
                // 此时设置 background-image 浏览器不会发起请求
                if (!bg || !this.loaded) return { display: 'none' };
                // 如果不是 http(s) 协议，则走服务端本地文件代理
                let url = bg;
                if (!/^https?:\/\//i.test(bg)) {
                    url = API.fileProxyUrl(bg);
                }
                return {
                    backgroundImage: "url('" + url + "')",
                    opacity: this.userSettings.opacity != null ? this.userSettings.opacity : 0.3
                };
            },
        },

        methods: {

            /**
             * 将根路径转换为相对路径（相对当前目录）
             * @param {string} path - 不带前导 / 的路径
             * @returns {string} 带 BASE_PATH 前缀的完整路径
             */
            $api(path) {
                return API.BASE_PATH + path;
            },

            /**
             * 带缓存的工具结果 JSON 解析（模板中使用）。
             * 避免每次 Vue 更新都对同一 content 重复 JSON.parse。
             * @param {object} content - 消息的 content 对象
             * @returns {object} 解析后的工具结果
             */
            $toolParsed(content) {
                let raw = content.content;
                if (content._rawJson !== raw) {
                    content._rawJson = raw;
                    content._parsed = JSON.parse(raw);
                }
                return content._parsed;
            },

            /**
             * 获取工具消息的聚合执行状态（模板中使用）。
             * 在折叠的头部显示成功/失败图标和颜色。
             * @param {object} msg - 工具消息对象
             * @returns {{ succeed: boolean, icon: string, color: string, text: string }}
             */
            $toolStatus(msg) {
                // 工具执行中：黄色占位状态
                if (msg.extension && msg.extension.status === 'executing') {
                    return { succeed: true, icon: 'circle-dot', color: '#faad14', text: '执行中…' };
                }
                if (!msg.contents || msg.contents.length === 0) {
                    return { succeed: true, icon: 'circle-check', color: '#52c41a', text: '执行成功' };
                }
                // 检查所有 content：只要有一个失败，整体就算失败
                let allSucceed = true;
                for (let content of msg.contents) {
                    if (content.type === 'text') {
                        try {
                            let parsed = this.$toolParsed(content);
                            if (!parsed.succeed) {
                                allSucceed = false;
                                break;
                            }
                        } catch (e) {
                            allSucceed = false;
                            break;
                        }
                    }
                }
                return allSucceed
                    ? { succeed: true, icon: 'circle-check', color: '#52c41a', text: '执行成功' }
                    : { succeed: false, icon: 'circle-x', color: '#ff4d4f', text: '执行失败' };
            },

            /**
             * 获取消息对应的头像 URL
             */
            getMessageAvatar(msg) {
                if (msg.role === 'user' && this.userAvatarError) return '';
                if (msg.role === 'assistant' && this.assistantAvatarError) return '';
                // 世界观角色用自己的头像；未设置头像时显示默认首字母头像，
                // 不复用全局 assistant 设置头像（避免串入角色插件配置的头像）
                const avatar = msg.role === 'user'
                    ? this.userSettings.avatar
                    : this.worldCharacters[msg.name];
                if (!avatar) return '';
                if (avatar.startsWith('data:')) return avatar;
                if (!/^https?:\/\//i.test(avatar)) {
                    return API.fileProxyUrl(avatar);
                }
                return avatar;
            },

            /**
             * 获取消息头像的默认首字母
             */
            getAvatarInitial(msg) {
                if (msg.role === 'user') {
                    return (this.userSettings.username || 'U').charAt(0);
                }
                return (msg.name || this.assistantSettings.assistantName || 'A').charAt(0);
            },

            /**
             * 拆分消息文本中的私聊标签段，返回 [{type:'text'|'private'|'switch', text, from?, to?, monologue?}]
             * 私聊标签 <private from="发送者" to="接收者">内容</private>：属性顺序任意、to 可省略（省略=内心独白）。
             * 未闭合/无标签时整体按普通文本处理。
             */
            privateSegments(content) {
                if (!content || (!content.includes('<private') && !content.includes('<switch'))) {
                    return [{ type: 'text', text: content || '' }];
                }
                const segs = [];
                const re = /<private\b([^>]*)>([\s\S]*?)<\/private>|<switch\s+to\s*[:=]\s*["']([^"']*)["']\s*\/?>/g;
                let last = 0;
                let m;
                while ((m = re.exec(content)) !== null) {
                    if (m.index > last) {
                        segs.push({ type: 'text', text: content.slice(last, m.index) });
                    }
                    if (m[1] !== undefined) {
                        // 私聊段：from/to 属性顺序任意，to 可省略（省略=独白）
                        const attrs = m[1];
                        const from = ((attrs.match(/\bfrom\s*[:=]\s*["']([^"']*)["']/i)) || [])[1] || '';
                        const to = ((attrs.match(/\bto\s*[:=]\s*["']([^"']*)["']/i)) || [])[1] || '';
                        segs.push({ type: 'private', from: from.trim(), to: to.trim(), text: m[2], monologue: !to.trim() });
                    } else {
                        segs.push({ type: 'switch', to: (m[3] || '').trim() });
                    }
                    last = m.index + m[0].length;
                }
                if (last < content.length) {
                    segs.push({ type: 'text', text: content.slice(last) });
                }
                return segs;
            },

            /**
             * 私聊块是否展开：优先用户手动点击的状态；未手动操作过时按默认规则
             * （夺舍角色参与其中的展开；未夺舍则全部展开）
             */
            isPrivateExpanded(msgId, segIdx, seg) {
                if (this.expandedPrivate && this.expandedPrivate[msgId + '_' + segIdx] !== undefined) {
                    return this.expandedPrivate[msgId + '_' + segIdx];
                }
                return this.isPrivateDefaultExpanded(seg);
            },

            /**
             * 私聊块默认展开规则：
             * - 玩家夺舍了角色（possessName 非空）：仅当夺舍角色在 from/to 中时展开；
             * - 玩家未夺舍：全部展开。
             */
            isPrivateDefaultExpanded(seg) {
                if (!seg || seg.type !== 'private') return false;
                const possess = this.worldInfo && this.worldInfo.possessName;
                if (!possess) return true;
                const participants = ((seg.from || '') + ',' + (seg.to || ''))
                    .split(/[,\s，、;；]+/)
                    .filter(Boolean);
                return participants.includes(possess);
            },

            /** 切换私聊块展开/收起（基于当前生效状态取反，兼容默认展开规则） */
            togglePrivate(msgId, segIdx, seg) {
                if (!this.expandedPrivate) this.expandedPrivate = {};
                const key = msgId + '_' + segIdx;
                this.expandedPrivate[key] = !this.isPrivateExpanded(msgId, segIdx, seg);
            },

            inLoading() {
                document.getElementById("app").style.display = "none";
                document.getElementById("in-loading").style.display = "block";
            },

            outLoading() {
                document.getElementById("in-loading").style.display = "none";
                let appStyle = document.getElementById("app").style;
                appStyle.transition = "all 0.5s ease";
                appStyle.opacity = "0";
                appStyle.width = "50dvw";
                appStyle.display = "flex";
                // 此时 #app 已可见，通知 Vue 可以设置 background-image 了
                // 这样浏览器才会真正发起背景图请求
                this.loaded = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        appStyle.transition = "all 1s ease";
                        appStyle.opacity = "1";
                        appStyle.width = "100dvw";
                    })
                });
            },

            async init() {
                this.inLoading();
                await this.fetchWorlds();
                // 从 URL 参数中读取 worldId（从群聊设置页跳转过来时携带），缺省取第一个世界
                const params = new URLSearchParams(window.location.search);
                this.worldId = params.get('worldId') || (this.worlds.length > 0 ? this.worlds[0].id : null);
                if (this.worldId) {
                    await this.fetchWorldInfo();
                    await this.fetchWorldCharacters();
                }
                await this.fetchUserSettings();
                await this.fetchAssistantSettings();
                await this.getChatSettings();
                await this.fetchGreeting();
                // worldId 加载完成后刷新侧边栏会话列表
                if (this.worldId) {
                    this.$refs.sidebar.refresh();
                }
                this.outLoading();
            },

            /** 获取全部世界观（顶部选择器选项） */
            async fetchWorlds() {
                try {
                    const result = await API.world.list();
                    if (result.status === 200) {
                        this.worlds = result.data || [];
                    }
                } catch (error) {
                    console.error('获取世界观列表失败:', error);
                }
            },

            /** 获取当前世界观信息 */
            async fetchWorldInfo() {
                if (!this.worldId) return;
                try {
                    const result = await API.world.get(this.worldId);
                    if (result.status === 200) {
                        this.worldInfo = result.data;
                        // 世界观主题色作为页面主色
                        if (this.worldInfo.mainColor) {
                            this.mainColor = this.worldInfo.mainColor;
                        }
                    }
                } catch (error) {
                    console.error('获取世界观信息失败:', error);
                }
            },

            /** 获取世界内角色，构建 name -> avatar 映射用于气泡头像，同时保留列表供私聊选择 */
            async fetchWorldCharacters() {
                if (!this.worldId) return;
                try {
                    const result = await API.world.character.list(this.worldId);
                    if (result.status === 200) {
                        const list = result.data || [];
                        const map = {};
                        for (let c of list) {
                            map[c.name] = c.avatar || '';
                        }
                        this.worldCharacters = map;
                        this.worldCharacterList = list;
                    }
                } catch (error) {
                    console.error('获取世界观角色失败:', error);
                }
            },

            async fetchUserSettings() {
                try {
                    const result = await API.settings.user.get();
                    if (result.status === 200) {
                        this.userSettings = result.data || { background: '', opacity: 0.3 };
                        // 从服务端获取主题色（世界观已设主题色时优先用世界观的）
                        if (this.userSettings.mainColor && (!this.worldInfo || !this.worldInfo.mainColor)) {
                            this.mainColor = this.userSettings.mainColor;
                        }
                    }
                } catch (error) {
                    console.error('获取用户设置失败:', error);
                }
                // 服务端没有则回退到 localStorage（同样不覆盖世界观主题色）
                if (!this.userSettings.mainColor && (!this.worldInfo || !this.worldInfo.mainColor)) {
                    try {
                        const saved = localStorage.getItem('assistant-mainColor');
                        if (saved) {
                            this.mainColor = saved;
                        }
                    } catch (e) {}
                }
            },

            async fetchAssistantSettings() {
                try {
                    const result = await API.settings.assistant.get();
                    if (result.status === 200) {
                        this.assistantSettings = result.data || { avatar: '', assistantName: '' };
                    }
                } catch (error) {
                    console.error('获取助手设置失败:', error);
                }
            },

            async getChatSettings() {
                try {
                    const result = await API.settings.chat.get();
                    if (result.status === 200) {
                        this.chatModel = result.data.model;
                    } else {
                        ElementPlus.ElMessage.error(result.message || '获取聊天设置失败');
                    }
                } catch (error) {
                    ElementPlus.ElMessage.error('网络请求失败，请检查网络连接');
                    console.error('获取聊天设置失败:', error);
                }
            },

            /**
             * 获取随机问候语
             */
            async fetchGreeting() {
                try {
                    const result = await API.greeting.random();
                    if (result.status === 200 && result.data) {
                        this.greetingText = result.data.text;
                    } else {
                        this.greetingText = '你好！今天有什么可以帮你的吗？';
                    }
                } catch (error) {
                    console.error('获取问候语失败:', error);
                }
            },

            selectSession(session) {
                this.closeSidebar();
                this.$md.clearCache();
                this.sessionSelectLoading = true;
                this.currentSession = session;
                // isStreaming 为计算属性，切会话后自动读新会话自己的标记，无需复位
                API.message.getHistory(session.id).then(result => {
                    if (result.status === 200) {
                        this.currentMessages = result.data;
                        this.scrollToBottom(true);
                        // 请求该会话的总线续传：若当前有一轮在进行中，服务端回放缓冲事件重建在途消息
                        if (this.ws && this.ws.readyState === 1) {
                            this.ws.send("###REQUIRE_REPLAY_MESSAGE###" + session.id);
                        }
                    } else {
                        ElementPlus.ElMessage.error(result.message || '获取会话历史消息失败');
                    }
                    this.$nextTick(() => {
                        MermaidUtils.renderAll();
                    });
                }).catch(error => {
                    ElementPlus.ElMessage.error('网络请求失败，请检查网络连接');
                    console.error('获取会话历史消息失败:', error);
                }).finally(() => {
                    this.sessionSelectLoading = false;
                });
            },

            /**
             * 斜杠指令面板键盘导航。
             * 由 auto-resize-textarea 的 @keydown 事件触发。
             */
            /** Esc 键：优先关闭指令面板，否则走默认行为 */
            onTextareaCancel(event) {
                if (this.commandSubMode) {
                    this.onCommandBack();
                    return;
                }
                if (this.commandSuggestVisible) {
                    this.inputText = '';
                    return;
                }
                this.currentEditId = null;
                this.editDraft = '';
                this.editTargetRole = null;
            },

            onTextareaKeydown(event) {
                if (!this.commandSuggestVisible) return;

                // 二级面板模式
                if (this.commandSubMode) {
                    const len = this.subOptions.length;
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        this.commandActiveIndex = (this.commandActiveIndex + 1) % len;
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        this.commandActiveIndex = (this.commandActiveIndex - 1 + len) % len;
                    } else if (event.key === 'Enter' && !event.ctrlKey && !event.shiftKey) {
                        event.preventDefault();
                        const opt = this.subOptions[this.commandActiveIndex];
                        if (opt) this.onSubSelect(opt);
                    } else if (event.key === 'Escape') {
                        event.preventDefault();
                        this.onCommandBack();
                    }
                    return;
                }

                // 一级面板模式
                const len = this.filteredCommands.length;
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    this.commandActiveIndex = (this.commandActiveIndex + 1) % len;
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    this.commandActiveIndex = (this.commandActiveIndex - 1 + len) % len;
                } else if (event.key === 'Enter' && !event.ctrlKey && !event.shiftKey) {
                    event.preventDefault();
                    const cmd = this.filteredCommands[this.commandActiveIndex];
                    if (cmd) this.onCommandSelect(cmd);
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    this.inputText = '';
                }
            },

            /**
             * 选中一级指令：有 subCommand 则进入二级面板，否则直接替换输入框。
             */
            onCommandSelect(cmd) {
                this.inputText = cmd.name + ' ';
                if (cmd.subCommand) {
                    this.commandSubMode = cmd.subCommand;
                    this.commandParentCmd = cmd;
                    this.commandActiveIndex = 0;
                    return;
                }
                this.commandActiveIndex = 0;
                this.$nextTick(() => {
                    const ta = document.querySelector('.send-area-textarea');
                    if (ta) ta.focus();
                });
            },

            /** 选中二级选项（如会话） → 拼出最终指令 */
            onSubSelect(opt) {
                if (this.commandParentCmd && this.commandParentCmd.name === '/look') {
                    this.inputText = '/look ' + opt.id + ' ';
                }
                this.commandSubMode = null;
                this.commandParentCmd = null;
                this.commandActiveIndex = 0;
                this.$nextTick(() => {
                    const ta = document.querySelector('.send-area-textarea');
                    if (ta) ta.focus();
                });
            },

            /** 从二级面板返回一级 */
            onCommandBack() {
                this.commandSubMode = null;
                this.commandParentCmd = null;
                this.commandActiveIndex = 0;
            },

            /**
             * 发送消息
             * 根据是否已选中会话自动选择 create / append 模式
             */
            async sendMessage() {
                if (!this.worldId) {
                    ElementPlus.ElMessage.warning('请先选择一个世界观');
                    return;
                }
                if (this.sending) {
                    return; // 等待服务端 init_user 确认期间禁止重复发送
                }
                this.sending = true;
                let mode = this.currentSessionId ? 'append' : 'create';
                let request = {
                    mode: mode,
                    sessionId: this.currentSessionId,
                    content: this.inputText
                };
                if (this.uploadedFiles.length > 0) {
                    request.files = this.uploadedFiles;
                }
                this.ws.send(JSON.stringify(request));
                // 不在这里清空 inputText/uploadedFiles，改为在收到服务端 init_user 确认后再清空
                // 避免移动端 WebSocket 假连接导致消息丢失
            },

            /** 切换私聊浮条的展开/收起 */
            togglePrivateChatPanel() {
                if (this.privateChatPanelVisible) {
                    this.closePrivateChatPanel();
                } else {
                    this.openPrivateChatPanel();
                }
            },

            /** 展开私聊浮条（展开前刷新一次角色列表，保证选项新鲜） */
            async openPrivateChatPanel() {
                this.privateChatMode = 'whisper';
                this.privateChatForm = { targets: [], content: '' };
                if (this.worldId) await this.fetchWorldCharacters();
                this.privateChatPanelVisible = true;
                this.$nextTick(() => {
                    const input = document.querySelector('.private-chat-panel-input');
                    if (input) input.focus();
                });
            },

            /** 收起私聊浮条 */
            closePrivateChatPanel() {
                this.privateChatPanelVisible = false;
                this.privateChatForm = { targets: [], content: '' };
            },

            /** 切换发言权移交浮条 */
            toggleSwitchChatPanel() {
                if (this.switchChatPanelVisible) {
                    this.closeSwitchChatPanel();
                } else {
                    this.openSwitchChatPanel();
                }
            },

            /** 展开发言权移交浮条（展开前刷新角色列表，保证选项新鲜） */
            async openSwitchChatPanel() {
                this.switchChatForm = { target: '' };
                if (this.worldId) await this.fetchWorldCharacters();
                this.switchChatPanelVisible = true;
                this.$nextTick(() => lucide.createIcons());
            },

            /** 收起发言权移交浮条 */
            closeSwitchChatPanel() {
                this.switchChatPanelVisible = false;
                this.switchChatForm = { target: '' };
            },

            /** 添加发言权移交标签：<switch to:"角色名">，拼进发送栏 */
            addSwitchTag() {
                const target = (this.switchChatForm.target || '').trim();
                if (!target) { ElementPlus.ElMessage.warning('请选择移交对象'); return; }
                const tagged = `<switch to:"${target}">`;
                this.inputText = this.inputText.trim()
                    ? this.inputText.trimEnd() + '\n\n' + tagged
                    : tagged;
                this.closeSwitchChatPanel();
                this.$nextTick(() => {
                    const ta = document.querySelector('.send-area-textarea');
                    if (ta) ta.focus();
                });
            },

            /** 玩家身份：夺舍角色名，否则用户名（作为私聊标签的 from） */
            playerName() {
                if (this.worldInfo && this.worldInfo.possessName) return this.worldInfo.possessName;
                if (this.userSettings && this.userSettings.username) return this.userSettings.username;
                return '玩家';
            },

            /** 添加私聊/独白：内容自动包装成 <private> 标签（有 to=传纸条，无 to=独白），拼进发送栏（可混合发送） */
            addPrivateMessage() {
                const content = (this.privateChatForm.content || '').trim();
                if (!content) { ElementPlus.ElMessage.warning('请输入内容'); return; }
                let tagged;
                if (this.privateChatMode === 'monologue') {
                    tagged = `<private from="${this.playerName()}">${content}</private>`;
                } else {
                    const targets = (this.privateChatForm.targets || []).filter(Boolean);
                    if (targets.length === 0) { ElementPlus.ElMessage.warning('请选择私聊对象'); return; }
                    tagged = `<private from="${this.playerName()}" to="${targets.join(',')}">${content}</private>`;
                }
                this.inputText = this.inputText.trim()
                    ? this.inputText.trimEnd() + '\n\n' + tagged
                    : tagged;
                this.closePrivateChatPanel();
                this.$nextTick(() => {
                    const ta = document.querySelector('.send-area-textarea');
                    if (ta) ta.focus();
                });
            },

            /** 将会话绑定到当前世界观 */
            async bindSessionToWorld(sessionId) {
                try {
                    await API.world.bindSession({ sessionId: sessionId, worldId: this.worldId });
                } catch (error) {
                    console.error('绑定会话到世界观失败:', error);
                }
            },

            /**
             * 中止当前流式传输
             */
            stopStreaming() {
                console.log('Abort streaming')
                if (!this.isStreaming || !this.currentSessionId) return;
                API.chat.stop({ sessionId: this.currentSessionId })
                    .catch(err => console.error('中止请求发送失败:', err));
            },

            /**
             * 用真实工具结果替换对应的"执行中"占位消息（占位与结果共用同一个假 toolCallId，按 toolCallId 精确匹配）。
             * 找不到占位时（如页面刷新后）直接追加。
             */
            replaceToolPlaceholder(resultMsg) {
                if (!resultMsg || !resultMsg.toolCallId) return;
                let idx = this.currentMessages.findIndex(m =>
                    m.role === 'tool'
                    && m.extension && m.extension.status === 'executing'
                    && m.toolCallId === resultMsg.toolCallId);
                if (idx !== -1) {
                    this.currentMessages.splice(idx, 1, resultMsg);
                } else {
                    this.currentMessages.push(resultMsg);
                }
                this.scrollToBottom();
            },

            /**
             * 连接建立/重连后挂 onmessage，并按需请求当前会话的总线续传。
             * 服务端收到后回 ###REPLAY_MESSAGE### 标记并逐帧重放当前进行中一轮的事件日志。
             */
            onWsConnect(ws) {
                this.ws = ws;
                this.ws.onmessage = (e) => this.handleStreamChunk(e);
                if (this.currentSessionId) {
                    // 断线重连：清空全部流式标记并清掉残留占位（轮次可能已结束、缓冲已清空）。
                    // 若轮次仍在进行，###REPLAY_MESSAGE### 重放会重建并重新置 true
                    this.streamingMap = {};
                    this.currentMessages = this.currentMessages.filter(m => !(m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                    this.ws.send("###REQUIRE_REPLAY_MESSAGE###" + this.currentSessionId);
                }
            },

            /**
             * 处理服务端流式推送的每一个 chunk
             * 通过 sessionId 匹配到对应 session 的消息列表后进行处理
             */
            async handleStreamChunk(event) {
                if (event.data.startsWith(':')) {
                    return;
                }
                if (event.data.startsWith("###REPLAY_MESSAGE###")) {
                    let sessionId = event.data.split('###REPLAY_MESSAGE###')[1];
                    if (this.currentSessionId !== sessionId) {
                        return;
                    }
                    // 截断到最后一条 user 消息（连同残留的流式占位），之后的重放帧按正常路径重建本轮
                    this.streamingMap[sessionId] = false;
                    const lastUserIndex = this.currentMessages.findLastIndex(m => m.role === 'user');
                    if (lastUserIndex !== -1) {
                        this.currentMessages.splice(lastUserIndex);
                    }
                    return;
                }
                if (event.data.startsWith('###START###')) {
                    let sessionId = event.data.split('###START###')[1];
                    this.streamingMap[sessionId] = true;
                    // 新一轮开始：清掉该会话残留的流式占位（异常中断后重开的情况）
                    this.currentMessages = this.currentMessages.filter(m => !(m.sessionId === sessionId && m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                    // 生成临时 ID，避免 :key 为 undefined
                    let assistantMessage = Utils.getDefaultAssistantMessage(sessionId);
                    if (!this.currentSessionId || sessionId === this.currentSessionId) {
                        this.currentMessages.push(assistantMessage);
                    }
                    return;
                }
                if (event.data.startsWith('###REPLACE###')) {
                    let messageId = event.data.split('###REPLACE###')[1];
                    let index = this.currentMessages.findIndex(m => m.id === messageId)
                    console.log('replace:', index)
                    if (index !== -1) {
                        this.currentMessages.splice(index);
                    }
                    return;
                }
                if (event.data.startsWith('###TOOL_ASK###')) {
                    let commandConfirm = JSON.parse(event.data.split('###TOOL_ASK###')[1]);
                    this.$refs.toolConfirm.show(commandConfirm);
                    return;
                }
                if (event.data.startsWith('###END###')) {
                    // 结束流式传输：清掉该会话残留的流式占位（正常情况已由 init_assistant 赋予真实 id，无需处理）
                    let sessionId = event.data.split('###END###')[1];
                    this.streamingMap[sessionId] = false;
                    this.currentMessages = this.currentMessages.filter(m => !(m.sessionId === sessionId && m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                    this.$nextTick(() => {
                        MermaidUtils.renderAll();
                    });
                    return;
                }
                if (event.data.startsWith('###WORLD_ROUND###')) {
                    // 群聊轮次边界：携带 "sessionId|角色名"，结束上一轮（含 init_user 空占位），开启本轮新气泡
                    let parts = event.data.split('###WORLD_ROUND###')[1];
                    let sepIdx = parts.indexOf('|');
                    let sessionId = sepIdx > 0 ? parts.substring(0, sepIdx) : parts;
                    let speaker = sepIdx > 0 ? parts.substring(sepIdx + 1) : null;
                    if (sessionId === this.currentSessionId) {
                        // 结束上一轮：清掉残留的流式占位（正常情况上一轮已由 init_assistant 赋予真实 id）
                        this.currentMessages = this.currentMessages.filter(m => !(m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                        let lastMsg = Utils.getLast(this.currentMessages);
                        let assistantMessage = Utils.getDefaultAssistantMessage(sessionId, lastMsg ? lastMsg.id : null);
                        if (speaker) assistantMessage.name = speaker;
                        this.currentMessages.push(assistantMessage);
                        this.currentToolCallId = null;
                        this.scrollToBottom();
                    }
                    return;
                }
                if (event.data.startsWith('###WORLD_POSSESS###')) {
                    // 调度器选中夺舍角色，回合交还玩家：提示"轮到你了"
                    let parts = event.data.split('###WORLD_POSSESS###')[1];
                    let sepIdx = parts.indexOf('|');
                    let sessionId = sepIdx > 0 ? parts.substring(0, sepIdx) : parts;
                    let name = sepIdx > 0 ? parts.substring(sepIdx + 1) : null;
                    if (sessionId === this.currentSessionId) {
                        ElementPlus.ElMessage({
                            message: '🔒 ' + (name || '你的角色') + ' 由你扮演，轮到你发言了',
                            type: 'info',
                            duration: 3000
                        });
                    }
                    return;
                }
                if (event.data.startsWith('###UPDATE_SESSION###')) {
                    let sessionJson = event.data.split('###UPDATE_SESSION###')[1];
                    console.log('update session', sessionJson)
                    let session = JSON.parse(sessionJson);
                    let ref = this.$refs.sidebar.upsert(session);
                    if (session.id === this.currentSessionId) {
                        this.currentSession = ref;
                    }
                    return;
                }
                if (event.data.startsWith('###TOOL_CALL_FINISH###')) {
                    let sessionId = event.data.split('###TOOL_CALL_FINISH###')[1];
                    // 本轮全部工具执行完毕（空 messages 的轮次边界）→ 推进流式占位到下一轮 AI 回复
                    // 先清掉残留的流式占位（正常情况上一轮已由 init_assistant 赋予真实 id）
                    this.currentMessages = this.currentMessages.filter(m => !(m.sessionId === sessionId && m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                    let assistantMessage = Utils.getDefaultAssistantMessage(sessionId);
                    if (sessionId === this.currentSessionId) {
                        this.currentMessages.push(assistantMessage);
                        this.currentToolCallId = null;
                    }
                    return;
                }
                if (event.data.startsWith('###')) {
                    console.warn("未知的信号:" + event.data);
                    return;
                }

                let response = JSON.parse(event.data);

                let streamingMessage = this.currentMessages.findLast(m => m.sessionId === response.sessionId && m.role === 'assistant' && m.id && m.id.startsWith('streaming_'));

                switch (response.status) {
                    case 'init_user': {
                        console.log('init_user', response)
                        this.sending = false; // 服务端已确认收到消息，恢复可发送
                        if (!this.currentSession.id) {
                            this.currentSession.id = response.sessionId;
                            // 新会话创建后，绑定到当前世界观
                            if (this.worldId && response.sessionId) {
                                this.bindSessionToWorld(response.sessionId);
                            }
                        }

                        // 编辑/重发场景：后端用同一 parentId 重新确认用户消息（旧 B 与新 B' 的 parentId 相同），
                        // 按 parentId 定位旧消息并掐掉它及之后的所有内容；正常发送时消息不在列表中，无需处理
                        let cutIndex = -1;
                        for (const message of response.messages) {
                            let idx = this.currentMessages.findLastIndex(m => m.role === 'user' && m.parentId === message.parentId);
                            if (idx !== -1) {
                                cutIndex = idx;
                                break;
                            }
                        }
                        if (cutIndex !== -1) {
                            this.currentMessages.splice(cutIndex);
                        }
                        this.currentMessages.push(...response.messages);

                        await this.$refs.sidebar.refresh();
                        if (!this.currentSessionId) {
                            let session = {id: response.sessionId}
                            this.currentSession = this.$refs.sidebar.get(session);
                        }

                        // 服务端已确认收到消息，此时清空输入框和已上传文件
                        this.inputText = '';
                        this.uploadedFiles = [];

                        this.scrollToBottom(true);
                        // 用户消息中可能包含 mermaid 图表，收到确认后立即渲染（无需等流结束）
                        this.$nextTick(() => {
                            MermaidUtils.renderAll();
                        });
                        break;
                    }
                    case 'tool_execution': {
                        // 工具开始执行：插入黄色"执行中"占位消息，工具结果到达后按工具名替换
                        if (response.sessionId === this.currentSessionId
                                && response.messages && response.messages.length > 0) {
                            let placeholder = response.messages[0];
                            // 兜底标记：确保渲染层能识别为"执行中"
                            placeholder.extension = placeholder.extension || {};
                            placeholder.extension.status = 'executing';
                            this.currentMessages.push(placeholder);
                            this.scrollToBottom();
                        }
                        break;
                    }
                    case 'tool_response': {
                        // 单个工具执行完成 → 用真实结果替换同名"执行中"占位
                        if (response.sessionId === this.currentSessionId) {
                            for (let m of response.messages) {
                                this.replaceToolPlaceholder(m);
                            }
                        }
                        break;
                    }
                    case 'init_tool': {
                        // 工具消息已落库，携带真实 DB id：校准占位/结果消息的假 id，
                        // 保证 replace 时能按 parentId 找到父工具消息（刷新后从 DB 拉取则为真 id，无需校准）
                        if (response.sessionId === this.currentSessionId && response.messages) {
                            for (let m of response.messages) {
                                let idx = this.currentMessages.findIndex(x =>
                                    x.role === 'tool' && x.toolCallId === m.toolCallId);
                                if (idx !== -1) {
                                    // 只同步元数据，保留已显示的工具结果内容
                                    let localMsg = this.currentMessages[idx];
                                    if (m.id) localMsg.id = m.id;
                                    if (m.parentId) localMsg.parentId = m.parentId;
                                    if (m.createTime) localMsg.createTime = m.createTime;
                                }
                            }
                        }
                        break;
                    }
                    case 'done':
                    case 'chunk': {
                        if (!streamingMessage) {
                            console.warn('未找到对应的 streamingMessage, sessionId:', response.sessionId);
                            return;
                        }

                        // 追加思维过程（修复 null/undefined 拼接为 "null"/"undefined" 的问题）
                        if (response.reasoningContent) {
                            streamingMessage.reasoningContent += response.reasoningContent;
                        }
                        // 追加内容（修复 null 拼接为 "null" 的问题）
                        if (response.text) {
                            let lastContent = Utils.getLast(streamingMessage.contents);
                            if (lastContent) {
                                lastContent.content += response.text;
                            }
                        }
                        // 追加工具调用（修复 for 循环条件：.length 缺失）
                        if (response.messages && response.messages.length > 0) {
                            for (let index = 0; index < response.messages.length; index++) {
                                let message = response.messages[index];
                                if (message.sessionId) streamingMessage.sessionId = message.sessionId;
                                if (message.parentId) streamingMessage.parentId = message.parentId;
                                if (message.name) streamingMessage.name = message.name;
                                if (message.role) streamingMessage.role = message.role;

                                if (message.toolCalls && message.toolCalls.length > 0) {
                                    for (let i = 0; i < message.toolCalls.length; i++) {
                                        let eventToolCall = message.toolCalls[i];
                                        if (eventToolCall.id) {
                                            this.currentToolCallId = eventToolCall.id;
                                        }
                                        let toolCall = streamingMessage.toolCalls.find(tc => tc.id === this.currentToolCallId);
                                        if (!toolCall) {
                                            toolCall = {id: this.currentToolCallId, name: '', arguments: ''};
                                            streamingMessage.toolCalls.push(toolCall);
                                        }
                                        if (eventToolCall.name) {
                                            toolCall.name = eventToolCall.name;
                                        }
                                        if (eventToolCall.arguments) {
                                            toolCall.arguments += eventToolCall.arguments;
                                        }
                                    }
                                }
                            }
                        }
                        // 流式传输中自动跟随滚动
                        this.scrollToBottom();
                        break
                    }
                    case "init_assistant": {
                        if (!streamingMessage) {
                            return;
                        }
                        // 只同步元数据属性，保留已累积的 contents / reasoningContent / toolCalls
                        const serverMsg = response.messages[0];
                        if (serverMsg.id) streamingMessage.id = serverMsg.id;
                        if (serverMsg.sessionId) streamingMessage.sessionId = serverMsg.sessionId;
                        if (serverMsg.parentId) streamingMessage.parentId = serverMsg.parentId;
                        if (serverMsg.name) streamingMessage.name = serverMsg.name;
                        if (serverMsg.role) streamingMessage.role = serverMsg.role;
                        if (serverMsg.createTime) streamingMessage.createTime = serverMsg.createTime;
                        if (serverMsg.siblingCount != null) streamingMessage.siblingCount = serverMsg.siblingCount;
                        if (serverMsg.siblingIndex != null) streamingMessage.siblingIndex = serverMsg.siblingIndex;
                        // 斜杠指令等场景：没有 chunk 流，文字直接附在 init_assistant 里
                        if (response.text) {
                            let lastContent = Utils.getLast(streamingMessage.contents);
                            if (lastContent && !lastContent.content) {
                                lastContent.content = response.text;
                            }
                        }
                        break;
                    }
                    case "error": {
                        console.error('AI 对话错误:', response);
                        this.sending = false; // 服务端处理失败，恢复可发送（允许重试）
                        // 清理该会话的流式消息，避免界面卡在"等待回复"状态。
                        // 后端在 handleChatSession 阶段（如 replace/edit 校验）出错时可能不带 sessionId，
