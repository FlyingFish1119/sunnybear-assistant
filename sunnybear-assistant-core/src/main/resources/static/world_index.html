                        // 此时兜底清理当前会话的流式消息，保证 isStreaming 一定能复位
                        const errSessionId = response.sessionId || this.currentSessionId;
                        if (errSessionId) {
                            this.currentMessages = this.currentMessages.filter(m => !(m.sessionId === errSessionId && m.role === 'assistant' && m.id && m.id.startsWith('streaming_')));
                        }
                        this.streamingMap[errSessionId] = false;
                        // 提取错误文本并提示用户
                        let errText = (response.messages && response.messages.length > 0)
                            ? response.messages[0].contents?.map(c => c.content).join('')
                            : 'AI 服务返回了一个错误，请稍后重试';
                        ElementPlus.ElMessage.error(errText || '未知错误');
                    }
                }
            },

            /**
             * 滚动消息列表到底部
             * @param {boolean} force - 为 true 时无视 _autoFollowPaused 强制滚动
             */
            scrollToBottom(force = false) {
                if (!force) {
                    var listEl = document.querySelector('.message-area-list');
                    if (listEl && listEl._autoFollowPaused) return;
                }
                this.$nextTick(() => {
                    requestAnimationFrame(() => {
                        var el = document.querySelector('.message-area-list');
                        if (el) {
                            el.scrollTop = el.scrollHeight;
                        }
                    });
                });
            },

            /**
             * 切换侧边栏：桌面端折叠/展开，移动端滑出抽屉
             */
            toggleSidebar() {
                this.$refs.sidebar.toggle();
            },

            /**
             * 关闭侧边栏（移动端抽屉 + 桌面端折叠通用）
             */
            closeSidebar() {
                this.$refs.sidebar.close();
            },

            /**
             * 创建会话
             */
            createSession() {
                this.closeSidebar();
                this.$md.clearCache();
                this.currentSession = {};
                this.currentMessages = [];
            },

            /**
             * 使用 requestAnimationFrame 合并图标刷新，避免流式传输时频繁全量扫描 DOM
             */
            _scheduleIconRefresh() {
                if (this._iconRefreshScheduled) return;
                this._iconRefreshScheduled = true;
                requestAnimationFrame(() => {
                    lucide.createIcons();
                    this._iconRefreshScheduled = false;
                });
            },

            /**
             * 左右切换兄弟分支
             * @param {object} msg - 当前消息对象
             * @param {string} direction - 'left' 或 'right'
             */
            async switchBranch(msg, direction) {
                try {
                    const result = await API.message.switchBranch(msg.id, direction);
                    if (result.status === 200) {
                        if (this.currentSessionId) {
                            await this.selectSession(this.currentSession);
                        }
                    } else {
                        ElementPlus.ElMessage.error(result.message || '切换分支失败');
                    }
                } catch (error) {
                    ElementPlus.ElMessage.error('网络请求失败，请检查网络连接');
                    console.error('切换分支失败:', error);
                }
            },
            
            /**
             * 进入编辑模式：设置 currentEditId 并初始化草稿
             * @param {object} msg - 用户消息对象
             */
            startEdit(msg) {
                // 提取消息文本
                let userText = '';
                if (msg.contents && msg.contents.length > 0) {
                    userText = msg.contents
                        .filter(c => c.type === 'text')
                        .map(c => c.content)
                        .join('\n');
                }
                this.currentEditId = msg.id;
                this.editTargetRole = 'user';
                this.editDraft = userText;
                // 双重 rAF 确保 DOM 完全就绪且 lucide 图标刷新不影响 focus
                this.$nextTick(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const el = document.querySelector('.message-edit-textarea');
                            if (el) {
                                el.focus();
                            }
                        });
                    });
                });
            },

            /**
             * 确认编辑：发送 edit 请求，移除旧分支
             * @param {object} msg - 用户消息对象
             */
            confirmEdit(msg) {
                if (!this.editDraft.trim()) {
                    ElementPlus.ElMessage.error('消息内容不能为空');
                    return;
                }
                // 找到该用户消息在当前消息列表中的位置，移除旧分支
                const index = this.currentMessages.findIndex(m => m.id === msg.id);
                if (index !== -1) {
                    this.currentMessages.splice(index);
                }
                // 通过 WebSocket 发送 edit 请求
                const request = {
                    mode: 'edit',
                    sessionId: this.currentSessionId,
                    editMessageId: msg.id,
                    content: this.editDraft
                };
                this.ws.send(JSON.stringify(request));
                // 清除编辑状态
                this.currentEditId = null;
                this.editDraft = '';
                this.editTargetRole = null;
            },

            /**
             * 取消编辑
             */
            cancelEdit() {
                this.currentEditId = null;
                this.editDraft = '';
                this.editTargetRole = null;
            },

            /**
             * 删除用户消息及其所有子孙消息
             * @param {object} msg - 用户消息对象
             */
            async deleteUserMessage(msg) {
                try {
                    const result = await API.message.deleteUser(msg.id);
                    if (result.status === 200) {
                        ElementPlus.ElMessage.success('消息已删除');
                        await this.selectSession(this.currentSession);
                    } else {
                        ElementPlus.ElMessage.error(result.message || '删除消息失败');
                    }
                } catch (error) {
                    ElementPlus.ElMessage.error('网络请求失败，请检查网络连接');
                    console.error('删除消息失败:', error);
                }
            },

            /**
             * 进入助手消息编辑模式
             * @param {object} msg - 助手消息对象
             */
            startAssistantEdit(msg) {
                let assistantText = '';
                if (msg.contents && msg.contents.length > 0) {
                    assistantText = msg.contents
                        .filter(c => c.type === 'text')
                        .map(c => c.content)
                        .join('\n');
                }
                this.currentEditId = msg.id;
                this.editTargetRole = 'assistant';
                this.editDraft = assistantText;
                // 双重 rAF 确保 DOM 完全就绪且 lucide 图标刷新不影响 focus
                this.$nextTick(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const el = document.querySelector('.message-edit-textarea');
                            if (el) {
                                el.focus();
                            }
                        });
                    });
                });
            },

            /**
             * 确认编辑助手消息
             * @param {object} msg - 助手消息对象
             */
            async confirmAssistantEdit(msg) {
                if (!this.editDraft.trim()) {
                    ElementPlus.ElMessage.error('消息内容不能为空');
                    return;
                }
                try {
                    const result = await API.message.editAssistant({ id: msg.id, content: this.editDraft });
                    if (result.status === 200) {
                        // 更新当前消息列表中该消息的文本
                        const targetMsg = this.currentMessages.find(m => m.id === msg.id);
                        if (targetMsg && targetMsg.contents && targetMsg.contents.length > 0) {
                            const textContent = targetMsg.contents.find(c => c.type === 'text');
                            if (textContent) {
                                textContent.content = this.editDraft;
                            } else {
                                targetMsg.contents.push({ type: 'text', content: this.editDraft });
                            }
                        }
                        // 内容已更新（可能包含 mermaid 图表），重新渲染图表
                        this.$nextTick(() => {
                            MermaidUtils.renderAll();
                        });
                        ElementPlus.ElMessage.success('消息已更新');
                    } else {
                        ElementPlus.ElMessage.error(result.message || '更新消息失败');
                    }
                } catch (error) {
                    ElementPlus.ElMessage.error('网络请求失败，请检查网络连接');
                    console.error('更新消息失败:', error);
                } finally {
                    this.currentEditId = null;
                    this.editDraft = '';
                    this.editTargetRole = null;
                }
            },

            /**
             * 取消助手消息编辑
             */
            cancelAssistantEdit() {
                this.currentEditId = null;
                this.editDraft = '';
                this.editTargetRole = null;
            },

            /**
             * 复制消息的原始文本到剪贴板
             * @param {object} msg - 消息对象
             */
            copyMessage(msg) {
                let text = '';
                if (msg.contents && msg.contents.length > 0) {
                    text = msg.contents
                        .filter(c => c.type === 'text')
                        .map(c => c.content)
                        .join('\n');
                }
                if (msg.role === 'assistant' && msg.reasoningContent) {
                    text = '思考过程:\n' + msg.reasoningContent + (text ? '\n\n' + text : '');
                }
                this.writeToClipboard(text);
            },

            /**
             * 写入剪贴板，优先使用现代 API，失败则降级到临时 textarea
             * @param {string} text - 要复制的文本
             */
            async writeToClipboard(text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                        ElementPlus.ElMessage.success('已复制到剪贴板');
                        return;
                    }
                } catch (e) {
                    console.warn('navigator.clipboard.writeText 失败，尝试降级方案', e);
                }
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    textarea.style.top = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (success) {
                        ElementPlus.ElMessage.success('已复制到剪贴板');
                    } else {
                        ElementPlus.ElMessage.error('复制失败，请手动复制');
                    }
                } catch (e) {
                    console.error('降级复制方案也失败', e);
                    ElementPlus.ElMessage.error('复制失败，请手动复制');
                }
            },

            /**
             * 侧边栏通知某会话已被删除，清理本地 state
             * @param session - 删除的会话对象
             */
            onDeleteSession(session) {
                // 侧边栏已从内部数组移除，父组件只需清理当前视图
                if (this.currentSession === session) {
                    this.currentSession = {};
                    this.currentMessages = [];
                }
            },

            /* ---------- 折叠/展开 ---------- */

            /**
             * 判断指定消息的指定区域是否处于折叠状态
             * @param {string} msgId - 消息 ID
             * @param {string} section - 区域标识：'thinking' | 'tool' | 'toolcalls'
             * @returns {boolean} 是否折叠
             */
            isThinkingMsg(msg) {
                if (!this.isStreaming || !(msg.role === 'assistant' && msg.id && msg.id.startsWith('streaming_'))) return false;
                const hasReasoning = msg.reasoningContent != null && msg.reasoningContent.length > 0;
                const lastContent = Utils.getLast(msg.contents);
                const bodyStarted = lastContent && lastContent.content && lastContent.content.length > 0;
                return hasReasoning && !bodyStarted;
            },

            isCollapsed(msgId, section) {
                const key = msgId + '_' + section;
                if (this.collapsedState[key] !== undefined) {
                    return this.collapsedState[key];
                }
                // 默认：思考过程展开，工具信息和工具调用折叠
                return section === 'tool' || section === 'toolcalls';
            },

            /**
             * 切换指定消息指定区域的折叠/展开状态
             * @param {string} msgId - 消息 ID
             * @param {string} section - 区域标识
             */
            toggleCollapse(msgId, section) {
                const key = msgId + '_' + section;
                const currentlyCollapsed = this.isCollapsed(msgId, section);

                const el = document.querySelector(`[data-collapse-key="${key}"]`);
                if (!el) {
                    this.collapsedState[key] = !currentlyCollapsed;
                    return;
                }

                if (currentlyCollapsed) {
                    // === 展开 ===
                    // scrollHeight 不受 max-height 裁剪影响，折叠状态下也能正确测量
                    el.style.transition = 'none';
                    const targetHeight = el.scrollHeight;
                    el.style.maxHeight = '0px';

                    // 更新状态 → Vue 移除 collapsed class；inline 0px 接管保持隐藏
                    this.collapsedState[key] = false;

                    this.$nextTick(() => {
                        el.offsetHeight; // 强制重排
                        el.style.transition = '';
                        el.style.maxHeight = targetHeight + 'px';

                        const onEnd = () => {
                            el.style.maxHeight = '';
                            el.style.transition = '';
                            el.removeEventListener('transitionend', onEnd);
                        };
                        el.addEventListener('transitionend', onEnd);
                    });
                } else {
                    // === 收起 ===
                    // 在 Vue 添加 collapsed class 之前，先锁定当前高度作为动画起点
                    el.style.transition = 'none';
                    el.style.maxHeight = el.scrollHeight + 'px';

                    // 更新状态 → Vue 添加 collapsed class；inline style 覆盖 CSS 保持起点高度
                    this.collapsedState[key] = true;

                    this.$nextTick(() => {
                        el.offsetHeight; // 强制重排
                        el.style.transition = '';
                        el.style.maxHeight = '0px';
                    });
                }
            },

        },

        mounted() {
            lucide.createIcons();
            this.init();
            // 代码块复制按钮（v-html 生成，无法用 Vue @click，走事件委托）
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.code-copy-btn');
                if (!btn) return;
                const wrapper = btn.closest('.code-block-wrapper');
                const code = wrapper && wrapper.querySelector('pre code');
                if (code) {
                    this.writeToClipboard(code.textContent);
                }
            });
        },

        watch: {
            // 让 Element Plus 组件（el-select 等）的强调色跟随主色，与 world_settings 一致
            mainColor: {
                handler(val) {
                    document.documentElement.style.setProperty('--el-color-primary', val);
                },
                immediate: true
            },
            filteredCommands() {
                this.commandActiveIndex = 0;
            },
            inputText(val) {
                if (!val || !val.startsWith('/')) {
                    this.commandSubMode = null;
                    this.commandParentCmd = null;
                }
            }
        },

        updated() {
            this._scheduleIconRefresh();
        },
    });

    // 注册全局工具 & 指令
    app.config.globalProperties.$fileUrl = FileUrlUtils;
    app.config.globalProperties.$md = MarkdownUtils;
    app.use(AutoFollow);
    // 注册组件库
    app.component('tool-confirm', ToolConfirm);
    app.component('confirm-dialog', ConfirmDialog);
    app.component('session-name', SessionName);
    app.component('world-sidebar', WorldSidebar);
    app.component('file-upload', FileUpload);
    app.component('connection-indicator', ConnectionIndicator);
    app.component('auto-resize-textarea', AutoResizeTextarea);
    app.component('command-suggest', CommandSuggest);

    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
