<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover">
    <title>世界观群聊 — SunnyBear 助手</title>
    <link rel="icon" type="image/png" href="../../icon/icon.png">
    <meta name="theme-color" content="#FFA07A">
    <script src="../../utils/theme-color.js"></script>
    <!-- Element Plus 样式 -->
    <link rel="stylesheet" href="../../lib/element-plus.css">
    <!-- Vue 3 -->
    <script src="../../lib/vue.global.prod.js"></script>
    <!-- Element Plus 组件库 -->
    <script src="../../lib/element-plus.full.min.js"></script>
    <!-- 轻提示：接管 ElMessage -->
    <script src="../../components/toast/toast.js"></script>
    <!-- lucide 图标 -->
    <script src="../../lib/lucide.min.js"></script>
    <script src="../../utils/lucide-safe.js"></script>
    <script src="../../lib/marked.min.js"></script>
    <script src="../../lib/highlight.min.js"></script>
    <!-- KaTeX 数学公式渲染 -->
    <link rel="stylesheet" href="../../lib/katex.min.css">
    <script src="../../lib/katex.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="../../lib/mermaid.min.js"></script>
    <!-- 项目本地封装 -->
    <script src="../../api.js"></script>
    <script src="world-api.js"></script>
    <script src="../../utils/render-markdown.js"></script>
    <script src="../../utils/color.js"></script>
    <script src="../../utils/mermaid.js"></script>
    <script src="../../utils/file-url.js"></script>
    <script src="../../utils/message-utils.js"></script>
    <script src="../../utils/token-format.js"></script>
    <!-- 图片查看器（灯箱） -->
    <script src="../../components/image-viewer/image-viewer.js"></script>
    <script src="../../directives/auto-follow.js"></script>
    <!-- WebSocket 消息总线 + 会话/消息仓库（核心流程唯一实现） -->
    <script src="../../utils/ws-bus.js"></script>
    <script src="../../stores/session-store.js"></script>
    <!-- 复用的核心组件 -->
    <script src="../../components/message-topbar/tool-confirm/tool-confirm.js"></script>
    <script src="../../components/message-topbar/tool-question/tool-question.js"></script>
    <script src="../../components/confirm-dialog/confirm-dialog.js"></script>
    <script src="../../components/message-topbar/chat-session-name/chat-session-name.js"></script>
    <script src="../../components/chat-sidebar/chat-sidebar.js"></script>
    <script src="../../components/send-area/file-upload/file-upload.js"></script>
    <script src="../../components/message-topbar/chat-connection/chat-connection.js"></script>
    <script src="../../components/auto-resize-textarea/auto-resize-textarea.js"></script>
    <script src="../../components/send-area/command-suggest/command-suggest.js"></script>
    <script src="../../components/message-topbar/message-topbar.js"></script>
    <script src="../../components/send-area/mark-tracker/mark-tracker.js"></script>
    <script src="../../components/send-area/send-area.js"></script>
    <!-- message-area 的子组件：必须先于 message-area.js -->
    <script src="../../components/message-area/message-area-context.js"></script>
    <script src="../../components/message-area/message-area-group/message-area-group.js"></script>
    <script src="../../components/message-area/message-area-user/message-area-user.js"></script>
    <script src="../../components/message-area/message-area-assistant/message-area-assistant.js"></script>
    <script src="../../components/message-area/message-area-tool/message-area-tool.js"></script>
    <script src="../../components/message-area/message-area-hero/message-area-hero.js"></script>
    <script src="../../components/message-area/message-area-compress/message-area-compress.js"></script>
    <script src="../../components/message-area/message-area-tokens/message-area-tokens.js"></script>
    <script src="../../components/message-area/message-area-text/message-area-text.js"></script>
    <script src="../../components/message-area/message-area.js"></script>
    <!-- 世界页插件组件（通过锚点注册挂进核心组件） -->
    <script src="components/world-private-text/world-private-text.js"></script>
    <script src="components/world-greeting/world-greeting.js"></script>
    <script src="components/world-settings-button/world-settings-button.js"></script>
    <script src="components/world-private-chat-button/world-private-chat-button.js"></script>
    <script src="components/world-private-chat-panel/world-private-chat-panel.js"></script>
    <script src="components/world-switch-chat-button/world-switch-chat-button.js"></script>
    <script src="components/world-switch-chat-panel/world-switch-chat-panel.js"></script>
    <!-- 样式 -->
    <link rel="stylesheet" href="../../css/scrollbar.css"/>
    <link rel="stylesheet" href="../../css/layout.css"/>
    <!-- 核心组件样式 -->
    <link rel="stylesheet" href="../../components/chat-sidebar/chat-sidebar.css"/>
    <link rel="stylesheet" href="../../components/message-area/message-area.css"/>
    <link rel="stylesheet" href="../../components/message-area/message-area-hero/message-area-hero.css"/>
    <link rel="stylesheet" href="../../components/message-area/message-area-compress/message-area-compress.css"/>
    <link rel="stylesheet" href="../../components/message-area/message-area-tokens/message-area-tokens.css"/>
    <link rel="stylesheet" href="../../components/message-topbar/message-topbar.css"/>
    <link rel="stylesheet" href="../../components/message-topbar/chat-session-name/chat-session-name.css"/>
    <link rel="stylesheet" href="../../components/send-area/send-area.css"/>
    <link rel="stylesheet" href="../../components/send-area/mark-tracker/mark-tracker.css"/>
    <link rel="stylesheet" href="../../components/send-area/file-upload/file-upload.css"/>
    <link rel="stylesheet" href="../../components/image-viewer/image-viewer.css"/>
    <link rel="stylesheet" href="../../components/message-topbar/tool-confirm/tool-confirm.css"/>
    <link rel="stylesheet" href="../../components/message-topbar/tool-question/tool-question.css"/>
    <link rel="stylesheet" href="../../components/confirm-dialog/confirm-dialog.css"/>
    <link rel="stylesheet" href="../../components/message-topbar/chat-connection/chat-connection.css"/>
    <link rel="stylesheet" href="../../components/auto-resize-textarea/auto-resize-textarea.css"/>
    <link rel="stylesheet" href="../../components/send-area/command-suggest/command-suggest.css"/>
    <link rel="stylesheet" href="../../css/markdown.css"/>
    <link rel="stylesheet" href="components/world-private-text/world-private-text.css"/>
    <link rel="stylesheet" href="components/world-greeting/world-greeting.css"/>
    <!-- highlight.js 代码高亮样式 -->
    <link rel="stylesheet" href="../../lib/highlight-github.min.css">
</head>
<body>
<div id="in-loading">
</div>
<div id="app">
    <chat-sidebar
        :main-color="mainColor"
        :collapsed="sidebarCollapsed"
        @toggle-collapsed="sidebarCollapsed = !sidebarCollapsed"
    ></chat-sidebar>
    <div class="message-area-wrapper" :class="{ 'expanded': sidebarCollapsed }">
        <!-- 拖拽上传遮罩 -->
        <div class="drag-overlay" v-show="dragOver">
            <div :style="{'--main-color': mainColor}" class="drag-overlay-content">
                <i data-lucide="upload-cloud"></i>
                <span>释放文件以上传</span>
            </div>
        </div>
        <div class="message-area-background" :style="backgroundStyle"></div>
        <!-- 顶栏（复用核心） -->
        <message-topbar
            :main-color="mainColor"
            :ws-url="wsUrl"
        ></message-topbar>
        <!-- 消息区（复用核心；开场 / 私聊正文经插件挂入） -->
        <message-area
            :main-color="mainColor"
            :user-settings="userSettings"
            :assistant-settings="assistantSettings"
        ></message-area>
        <!-- 发送区（复用核心；私聊 / 移交按钮与浮条经插件挂入） -->
        <send-area
            ref="sendArea"
            :main-color="mainColor"
            :commands="slashCommands"
            @drag-over-change="v => dragOver = v">
        </send-area>
    </div>
</div>

<script>
    /* ==================================================================
     * 世界观群聊页 = 核心流程复用 + 数据源适配 + 插件槽
     * ================================================================== */

    /* ---------- 页面级共享状态：插件组件通过 inject('worldPage') 读取 ---------- */
    const WorldPage = Vue.reactive({
        worldId: null,
        worldInfo: null,
        worldCharacterList: [],
        greetingText: '',
        possessName: null,
        username: '',
        mainColor: 'lightsalmon',
        // 私聊块展开状态：key = msgId_segIdx
        expandedPrivate: {},
        // 私聊浮条状态
        privateChat: { visible: false, mode: 'whisper', form: { targets: [], content: '' } },
        // 移交浮条状态
        switchChat: { visible: false, form: { target: '' } },
        // 供插件组件请求刷新角色列表（由页面注入实现）
        refreshCharacters: null
    });

    /* ---------- 适配层：把世界观专属数据源接进 SessionStore ---------- */
    let worldIdRef = null;

    SessionStore.configure({
        fetchPage: function (mode, size, cursorUpdateTime, cursorId) {
            if (!worldIdRef || cursorUpdateTime) {
                return Promise.resolve({ status: 200, data: { list: [], hasMore: false } });
            }
            return API.world.getSessions(worldIdRef).then(function (result) {
                if (result.status === 200) {
                    return { status: 200, data: { list: result.data || [], hasMore: false } };
                }
                return result;
            });
        },

        fetchHistory: function (sessionId) {
            return API.message.getHistory(sessionId);
        },

        buildCreateRequest: function (request, ctx) {
            if (ctx && ctx.isNew && worldIdRef) {
                request.extension = Object.assign({}, request.extension, { worldId: worldIdRef });
            }
            return request;
        },

        getWsUrl: function () {
            return API.ws.worldUrl;
        },

        /* 世界页私有 WS 信号：群聊轮次边界 / 夺舍回合提示 */
        onWsFrame: function (status, payload) {
            if (status === 'WORLD_ROUND') {
                handleWorldRound(payload);
            } else if (status === 'WORLD_POSSESS') {
                handleWorldPossess(payload);
            }
        }
    });

    /**
     * 群聊轮次边界：payload = "sessionId|角色名"。
     * 结束上一轮（清残留占位），开启本轮新的 assistant 气泡（发言人赋名）。
     */
    function handleWorldRound(payload) {
        const sepIdx = payload.indexOf('|');
        const sessionId = sepIdx > 0 ? payload.substring(0, sepIdx) : payload;
        const speaker = sepIdx > 0 ? payload.substring(sepIdx + 1) : null;
        if (sessionId !== SessionStore.currentSessionId) return;
        // 清掉残留的流式占位
        SessionStore.state.currentMessages = SessionStore.state.currentMessages.filter(
            m => !(m.role === 'assistant' && m.id && String(m.id).startsWith('streaming_')));
        const msgs = SessionStore.state.currentMessages;
        const last = msgs.length ? msgs[msgs.length - 1] : null;
        const assistantMessage = {
            id: 'streaming_' + Date.now(),
            sessionId: sessionId,
            parentId: last ? last.id : null,
            role: 'assistant',
            reasoningContent: '',
            contents: [{ type: 'text', content: '' }],
            toolCalls: []
        };
        if (speaker) assistantMessage.name = speaker;
        msgs.push(assistantMessage);
        SessionStore.state.currentToolCallId = null;
        const el = document.querySelector('.message-area-list');
        if (el) el.scrollTop = el.scrollHeight;
    }

    /** 夺舍角色，回合交还玩家：提示"轮到你了" */
    function handleWorldPossess(payload) {
        const sepIdx = payload.indexOf('|');
        const sessionId = sepIdx > 0 ? payload.substring(0, sepIdx) : payload;
        const name = sepIdx > 0 ? payload.substring(sepIdx + 1) : null;
        if (sessionId !== SessionStore.currentSessionId) return;
        ElementPlus.ElMessage({
            message: '🔒 ' + (name || '你的角色') + ' 由你扮演，轮到你发言了',
            type: 'info',
            duration: 3000
        });
    }

    /* ---------- 注册插件槽 ---------- */
    // 正文渲染器：私聊 / 独白 / 移交标签分段渲染
    MessageAreaPlugins.registerTextRenderer(WorldPrivateText);
    // 头像解析：群聊里 assistant 消息可能来自不同角色，按 msg.name 查世界角色头像
    MessageAreaPlugins.registerAvatarResolver(function (info) {
        const msg = info.msg;
        if (!msg || msg.role !== 'assistant' || !msg.name) return undefined;
        const ch = (WorldPage.worldCharacterList || []).find(c => c.name === msg.name);
        if (ch && ch.avatar) {
            return /^(data:|https?:)/i.test(ch.avatar) ? ch.avatar : API.fileProxyUrl(ch.avatar);
        }
        return msg.role === 'assistant' ? '' : undefined; // 有名字但无头像 → 走首字母兜底
    });
    MessageAreaPlugins.registerAvatarInitialResolver(function (info) {
        const msg = info.msg;
        if (!msg) return undefined;
        if (msg.role === 'user') return undefined;
        return (msg.name || info.defaultInitial || 'A').charAt(0);
    });
    // 开场横幅
    MessageAreaPlugins.registerSlot('message-list-top', WorldGreeting, 0);
    // 侧边栏设置按钮（跳世界专属设置页）
    ChatSidebarPlugins.registerSlot('sidebar-footer', WorldSettingsButton, 0);
    // 发送区：私聊 / 移交按钮与浮条
    SendAreaPlugins.registerSlot('toolbar', WorldPrivateChatButton, 0);
    SendAreaPlugins.registerSlot('toolbar', WorldSwitchChatButton, 10);
    SendAreaPlugins.registerSlot('overlay', WorldPrivateChatPanel, 0);
    SendAreaPlugins.registerSlot('overlay', WorldSwitchChatPanel, 10);

    // 隐藏不需要的内置元素
    // 顶栏：世界页顶栏只有会话名 + 连接状态
    TopbarPlugins.hideBuiltin('model');
    TopbarPlugins.hideBuiltin('ctx-gauge');
    TopbarPlugins.hideBuiltin('knowledge-flash');
    // 侧边栏：无定时器概念；右键菜单只留删除 / 导出；设置按钮跳世界专属页
    ChatSidebarPlugins.hideBuiltin('list-mode-toggle');
    ChatSidebarPlugins.hideBuiltin('menu-pro');
    ChatSidebarPlugins.hideBuiltin('menu-unreviewed');
    ChatSidebarPlugins.hideBuiltin('menu-knowledge');
    ChatSidebarPlugins.hideBuiltin('settings-button');
    // 消息操作按钮：群聊不编辑 / 不重新生成 AI 消息
    MessageAreaPlugins.hideBuiltin('assistant-edit');
    MessageAreaPlugins.hideBuiltin('assistant-replace');

    const app = Vue.createApp({
        data() {
            return {
                mainColor: (window.ThemeColorCache && window.ThemeColorCache.get()) || "lightsalmon",
                userSettings: { background: '', opacity: 0.3 },
                assistantSettings: { avatar: '', assistantName: '' },
                // 世界观群聊相关
                worldId: null,
                loaded: false,
                sidebarCollapsed: false,
                dragOver: false,
                slashCommands: []
            };
        },

        computed: {
            wsUrl: function () {
                return API.ws.worldUrl;
            },
            backgroundStyle() {
                const wi = WorldPage.worldInfo;
                const bg = (wi && wi.background) || this.userSettings.background;
                if (!bg || !this.loaded) return { display: 'none' };
                let url = bg;
                if (!/^https?:\/\//i.test(bg)) {
                    url = API.fileProxyUrl(bg);
                }
                const opacity = this.userSettings.opacity != null ? this.userSettings.opacity : 0.3;
                return {
                    backgroundImage: "url('" + url + "')",
                    opacity: opacity
                };
            }
        },

        methods: {
            inLoading() {
                document.getElementById("app").style.display = "none";
                document.getElementById("in-loading").style.display = "block";
            },

            outLoading() {
                document.getElementById("in-loading").style.display = "none";
                let appStyle = document.getElementById("app").style;
                appStyle.transition = "all 0.5s ease";
                appStyle.opacity = "0";
                appStyle.width = "50dvw";
                appStyle.display = "flex";
                this.loaded = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        appStyle.transition = "all 1s ease";
                        appStyle.opacity = "1";
                        appStyle.width = "100dvw";
                    });
                });
            },

            async init() {
                this.inLoading();
                const params = new URLSearchParams(window.location.search);
                this.worldId = params.get('worldId') || null;
                WorldPage.worldId = this.worldId;
                worldIdRef = this.worldId;
                if (this.worldId) {
                    await this.fetchWorldInfo();
                    await this.fetchWorldCharacters();
                    await this.fetchGreeting();
                }
                await this.fetchUserSettings();
                // 世界信息就绪后刷新侧边栏会话列表
                if (this.worldId) {
                    await SessionStore.refreshSessions();
                }
                this.outLoading();
            },

            async fetchWorldInfo() {
                if (!this.worldId) return;
                try {
                    const result = await API.world.get(this.worldId);
                    if (result.status === 200) {
                        WorldPage.worldInfo = result.data;
                        WorldPage.possessName = result.data.possessName || null;
                    }
                } catch (e) {
                    console.error('获取世界观信息失败:', e);
                }
            },

            async fetchWorldCharacters() {
                if (!this.worldId) return;
                try {
                    const result = await API.world.character.list(this.worldId);
                    if (result.status === 200) {
                        WorldPage.worldCharacterList = result.data || [];
                    }
                } catch (e) {
                    console.error('获取世界观角色失败:', e);
                }
            },

            async fetchGreeting() {
                try {
                    const result = await API.greeting.random();
                    if (result.status === 200 && result.data) {
                        WorldPage.greetingText = result.data;
                    }
                } catch (e) {
                    /* 问候语失败不影响主流程 */
                }
            },

            async fetchUserSettings() {
                try {
                    const result = await API.settings.user.get();
                    if (result.status === 200) {
                        this.userSettings = result.data || { background: '', opacity: 0.3 };
                        if (this.userSettings.mainColor) {
                            this.mainColor = this.userSettings.mainColor;
                        }
                        WorldPage.username = this.userSettings.username || '';
                    }
                } catch (error) {
                    console.error('获取用户设置失败:', error);
                }
                if (!this.userSettings.mainColor) {
                    try {
                        const saved = localStorage.getItem('assistant-mainColor');
                        if (saved) this.mainColor = saved;
                    } catch (e) {}
                }
                if (WorldPage.worldInfo && WorldPage.worldInfo.mainColor) {
                    this.mainColor = WorldPage.worldInfo.mainColor;
                }
                WorldPage.mainColor = this.mainColor;
            },

            /** 注册给 store 的 UI 副作用钩子 */
            registerStoreUi() {
                const self = this;
                SessionStore.registerUi({
                    scrollToBottom: function (force) {
                        if (!force) {
                            const listEl = document.querySelector('.message-area-list');
                            if (listEl && listEl._autoFollowPaused) return;
                        }
                        Vue.nextTick(function () {
                            requestAnimationFrame(function () {
                                const el = document.querySelector('.message-area-list');
                                if (el) el.scrollTop = el.scrollHeight;
                            });
                        });
                    },
                    renderMermaid: function () { MermaidUtils.renderAll(); },
                    clearMdCache: function () { if (self.$md) self.$md.clearCache(); },
                    isTtsEnabled: function () {
                        return self.$refs.sendArea ? self.$refs.sendArea.isTtsEnabled() : false;
                    },
                    enqueueTts: function (audio) {
                        if (self.$refs.sendArea) self.$refs.sendArea.enqueueTtsAudio(audio);
                    },
                    clearTts: function () {
                        if (self.$refs.sendArea && self.$refs.sendArea.clearTtsQueue) self.$refs.sendArea.clearTtsQueue();
                    },
                    clearSendArea: function () {
                        if (self.$refs.sendArea) self.$refs.sendArea.clear();
                    }
                });
            }
        },

        mounted() {
            lucide.createIcons();
            // 插件组件请求刷新角色列表
            WorldPage.refreshCharacters = () => this.fetchWorldCharacters();
            this.registerStoreUi();
            this.init();
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.code-copy-btn');
                if (!btn) return;
                const wrapper = btn.closest('.code-block-wrapper');
                const code = wrapper && wrapper.querySelector('pre code');
                if (code && code.textContent && navigator.clipboard) {
                    navigator.clipboard.writeText(code.textContent);
                }
            });
        },

        watch: {
            mainColor: {
                handler(val) {
                    document.documentElement.style.setProperty('--main-color', val);
                    document.documentElement.style.setProperty('--el-color-primary', val);
                    WorldPage.mainColor = val;
                },
                immediate: true
            }
        },

        updated() {
            if (typeof lucide !== 'undefined') {
                this.$nextTick(function () { lucide.createIcons(); });
            }
        }
    });

    app.config.globalProperties.$fileUrl = FileUrlUtils;
    app.config.globalProperties.$md = MarkdownUtils;
    app.use(AutoFollow);
    app.provide('sessionStore', SessionStore);
    app.provide('wsBus', WsBus);
    app.provide('worldPage', WorldPage);
    // 复用核心组件
    app.component('tool-confirm', ToolConfirm);
    app.component('tool-question', ToolQuestion);
    app.component('confirm-dialog', ConfirmDialog);
    app.component('chat-session-name', ChatSessionName);
    app.component('chat-sidebar', ChatSidebar);
    app.component('file-upload', FileUpload);
    app.component('chat-connection', ChatConnection);
    app.component('auto-resize-textarea', AutoResizeTextarea);
    app.component('command-suggest', CommandSuggest);
    app.component('message-topbar', MessageTopbar);
    app.component('message-area-hero', MessageAreaHero);
    app.component('message-area-compress', MessageAreaCompress);
    app.component('message-area-tokens', MessageAreaTokens);
    app.component('message-area-group', MessageAreaGroup);
    app.component('message-area-user', MessageAreaUser);
    app.component('message-area-assistant', MessageAreaAssistant);
    app.component('message-area-tool', MessageAreaTool);
    app.component('message-area-text', MessageAreaText);
    app.component('message-area', MessageArea);
    app.component('send-area', SendArea);
    app.component('mark-tracker', MarkTracker);
    // 世界页插件组件
    app.component('world-private-text', WorldPrivateText);
    app.component('world-greeting', WorldGreeting);
    app.component('world-settings-button', WorldSettingsButton);
    app.component('world-private-chat-button', WorldPrivateChatButton);
    app.component('world-private-chat-panel', WorldPrivateChatPanel);
    app.component('world-switch-chat-button', WorldSwitchChatButton);
    app.component('world-switch-chat-panel', WorldSwitchChatPanel);

    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
