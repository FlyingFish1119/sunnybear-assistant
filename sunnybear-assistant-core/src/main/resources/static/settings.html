<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 — SunnyBear 助手</title>
    <link rel="icon" type="image/png" href="icon/ComfyUI_23337_.png">
    <link rel="stylesheet" href="lib/element-plus.css">
    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/element-plus.full.min.js"></script>
    <script src="lib/lucide.min.js"></script>
    <script src="api.js"></script>
    <script src="components/confirm-dialog/confirm-dialog.js"></script>
    <script src="components/settings/settings-common.js"></script>
    <script src="components/settings/user-settings/user-settings.js"></script>
    <script src="components/settings/assistant-settings/assistant-settings.js"></script>
    <script src="components/settings/ai-settings/ai-settings.js"></script>
    <script src="components/settings/command-settings/command-settings.js"></script>
    <script src="components/settings/web-search-settings/web-search-settings.js"></script>
    <script src="components/settings/file-write-settings/file-write-settings.js"></script>
    <script src="components/settings/file-edit-settings/file-edit-settings.js"></script>
    <script src="components/settings/file-delete-settings/file-delete-settings.js"></script>
    <script src="components/settings/file-download-settings/file-download-settings.js"></script>
    <script src="components/settings/extension-script-settings/extension-script-settings.js"></script>
    <script src="components/settings/image-caption-settings/image-caption-settings.js"></script>
    <script src="components/settings/web-reader-settings/web-reader-settings.js"></script>
    <script src="components/settings/knowledge-api-settings/knowledge-api-settings.js"></script>
    <script src="components/settings/knowledge-params-settings/knowledge-params-settings.js"></script>
    <script src="components/settings/knowledge-manage-settings/knowledge-manage-settings.js"></script>
    <script src="components/settings/task-prompt-settings/task-prompt-settings.js"></script>
    <script src="components/settings/cron-job-settings/cron-job-settings.js"></script>
    <script src="components/settings/memory-settings/memory-settings.js"></script>
    <link rel="stylesheet" href="css/scrollbar.css"/>
    <link rel="stylesheet" href="css/settings.css"/>
    <link rel="stylesheet" href="components/confirm-dialog/confirm-dialog.css"/>
</head>
<body style="margin: 0; overflow: hidden">
<div id="app" :style="{'--main-color': mainColor}">
    <!-- 顶部导航 -->
    <div class="settings-topbar">
        <button type="button" class="back-btn" @click="goBack" title="返回">
            <i data-lucide="arrow-left" style="width:20px;height:20px"></i>
        </button>
        <span class="topbar-title">设置</span>
        <span class="topbar-subtitle">调整你的 Assistant</span>
    </div>

    <!-- 主体 -->
    <div class="settings-body-wrapper">
        <div class="settings-body">

        <!-- ==================== 用户与助手 ==================== -->
        <div class="settings-section-title">用户与助手</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="user-circle" style="width:18px;height:18px"></i>
                <span>用户设置</span>
            </div>
            <div class="settings-card-body">
                <user-settings :settings="userSettings" @saved="fetchAllSettings" @main-color-change="onMainColorChange"></user-settings>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="bot" style="width:18px;height:18px"></i>
                <span>助手设置</span>
            </div>
            <div class="settings-card-body">
                <assistant-settings :settings="assistantSettings" @saved="fetchAllSettings"></assistant-settings>
            </div>
        </div>

        <!-- ==================== AI 模型配置 ==================== -->
        <div class="settings-section-title">AI 模型配置</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="cpu" style="width:18px;height:18px"></i>
                <span>AI 模型</span>
            </div>
            <div class="settings-card-body">
                <ai-settings :settings="aiSettings" @saved="fetchAllSettings"></ai-settings>
            </div>
        </div>

        <!-- ==================== 工具配置 ==================== -->
        <div class="settings-section-title">工具配置</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="wrench" style="width:18px;height:18px"></i>
                <span>工具</span>
            </div>
            <div class="settings-card-body">
                <command-settings :settings="commandSettings" @saved="fetchAllSettings"></command-settings>
                <web-search-settings :settings="webSearchSettings" @saved="fetchAllSettings"></web-search-settings>
                <file-write-settings :settings="fileWriteSettings" @saved="fetchAllSettings"></file-write-settings>
                <file-edit-settings :settings="fileEditSettings" @saved="fetchAllSettings"></file-edit-settings>
                <file-delete-settings :settings="fileDeleteSettings" @saved="fetchAllSettings"></file-delete-settings>
                <file-download-settings :settings="fileDownloadSettings" @saved="fetchAllSettings"></file-download-settings>
                <extension-script-settings :settings="extensionScriptSettings" @saved="fetchAllSettings"></extension-script-settings>
                <image-caption-settings :settings="imageCaptionSettings" @saved="fetchAllSettings"></image-caption-settings>
                <web-reader-settings :settings="webReaderSettings" @saved="fetchAllSettings"></web-reader-settings>
            </div>
        </div>

        <!-- ==================== 知识库 ==================== -->
        <div class="settings-section-title">知识库</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="database" style="width:18px;height:18px"></i>
                <span>知识库</span>
            </div>
            <div class="settings-card-body">
                <knowledge-api-settings :settings="knowledgeApiSettings" @saved="fetchAllSettings"></knowledge-api-settings>
                <knowledge-params-settings :settings="knowledgeSettings" @saved="fetchAllSettings"></knowledge-params-settings>
                <knowledge-manage-settings :main-color="mainColor"></knowledge-manage-settings>
            </div>
        </div>

        <!-- ==================== 任务提示词 ==================== -->
        <div class="settings-section-title">任务提示词</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="file-text" style="width:18px;height:18px"></i>
                <span>Step 提示词</span>
            </div>
            <div class="settings-card-body">
                <task-prompt-settings :main-color="mainColor"></task-prompt-settings>
            </div>
        </div>

        <!-- ==================== 定时任务 ==================== -->
        <div class="settings-section-title">定时任务</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="clock" style="width:18px;height:18px"></i>
                <span>定时任务</span>
            </div>
            <div class="settings-card-body">
                <cron-job-settings :main-color="mainColor"></cron-job-settings>
            </div>
        </div>

        <!-- ==================== 记忆管理 ==================== -->
        <div class="settings-section-title">记忆管理</div>

        <div class="settings-card">
            <div class="settings-card-header">
                <i data-lucide="brain" style="width:18px;height:18px"></i>
                <span>记忆</span>
            </div>
            <div class="settings-card-body">
                <memory-settings :main-color="mainColor"></memory-settings>
            </div>
        </div>

    </div>
    </div>
</div>

<script>
const app = Vue.createApp({
    data() {
        return {
            mainColor: 'lightsalmon',

            // 所有设置原始数据（按分类传给对应组件）
            userSettings: {},
            assistantSettings: {},
            aiSettings: { chat: {}, chat_pro: {}, ocr: {}, mission: {}, task: {}, cub: {} },
            commandSettings: {},
            webSearchSettings: {},
            fileWriteSettings: {},
            fileEditSettings: {},
            fileDeleteSettings: {},
            fileDownloadSettings: {},
            imageCaptionSettings: {},
            webReaderSettings: {},
            extensionScriptSettings: {},
            knowledgeApiSettings: {},
            knowledgeSettings: {},
        }
    },

    watch: {
        // 同步 mainColor 到 :root (document.documentElement)，
        // 确保 el-dialog 等 teleport 到 #app 外部的组件也能读取到正确的主题色
        mainColor: {
            handler(val) {
                document.documentElement.style.setProperty('--main-color', val);
                document.documentElement.style.setProperty('--el-color-primary', val);
            },
            immediate: true
        }
    },

    methods: {
        /**
         * 将根路径转换为相对路径（相对当前目录）
         * @param {string} path - 不带前导 / 的路径
         * @returns {string} 带 BASE_PATH 前缀的完整路径
         */
        $api(path) {
            return API.BASE_PATH + path;
        },

        /* ---------- 导航 ---------- */
        goBack() {
            window.location.href = this.$api('index.html');
        },

        /* ---------- 主题色变更（来自用户设置组件） ---------- */
        onMainColorChange(color) {
            this.mainColor = color;
            try {
                localStorage.setItem('assistant-mainColor', color);
            } catch (e) {}
        },

        /* ---------- 获取所有设置 ---------- */
        async fetchAllSettings() {
            const fetchers = [
                { key: 'userSettings', url: 'settings/user/get' },
                { key: 'assistantSettings', url: 'settings/assistant/get' },
                { key: 'commandSettings', url: 'settings/command/get' },
                { key: 'webSearchSettings', url: 'settings/websearch/get' },
                { key: 'fileWriteSettings', url: 'settings/filewrite/get' },
                { key: 'fileEditSettings', url: 'settings/fileedit/get' },
                { key: 'fileDeleteSettings', url: 'settings/filedelete/get' },
                { key: 'fileDownloadSettings', url: 'settings/filedownload/get' },
                { key: 'imageCaptionSettings', url: 'settings/imagecaption/get' },
                { key: 'webReaderSettings', url: 'settings/webreadertool/get' },
                { key: 'extensionScriptSettings', url: 'settings/extensionscript/get' },
                { key: 'knowledgeApiSettings', url: 'settings/knowledgeapi/get' },
                { key: 'knowledgeSettings', url: 'settings/knowledgesettings/get' },
            ];

            const aiTypes = ['chat', 'chat_pro', 'ocr', 'mission', 'task', 'cub'];
            const aiFetchers = aiTypes.map(type => ({
                key: type,
                url: 'settings/' + type + '/get',
                isAi: true
            }));

            const all = [...fetchers, ...aiFetchers];
            const results = await Promise.allSettled(
                all.map(f => API.get(f.url).then(data => ({ key: f.key, isAi: f.isAi, data })))
            );

            for (const r of results) {
                if (r.status !== 'fulfilled') continue;
                const { key, isAi, data } = r.value;
                if (data.status === 200) {
                    if (isAi) {
                        this.aiSettings[key] = data.data || {};
                    } else {
                        this[key] = data.data || {};
                    }
                }
            }
            // 从服务端获取主题色并同步到本地；没有则回退 localStorage
            if (this.userSettings.mainColor) {
                this.mainColor = this.userSettings.mainColor;
                try {
                    localStorage.setItem('assistant-mainColor', this.userSettings.mainColor);
                } catch (e) {}
            } else {
                try {
                    const saved = localStorage.getItem('assistant-mainColor');
                    if (saved) {
                        this.mainColor = saved;
                    }
                } catch (e) {}
            }
        }
    },

    async mounted() {
        lucide.createIcons();
        await this.fetchAllSettings();
        this.$nextTick(() => lucide.createIcons());
    },

    updated() {
        this.$nextTick(() => lucide.createIcons());
    }
});

app.use(ElementPlus);
app.component('confirm-dialog', ConfirmDialog);
app.component('user-settings', UserSettings);
app.component('assistant-settings', AssistantSettings);
app.component('ai-settings', AiSettings);
app.component('command-settings', CommandSettings);
app.component('web-search-settings', WebSearchSettings);
app.component('file-write-settings', FileWriteSettings);
app.component('file-edit-settings', FileEditSettings);
app.component('file-delete-settings', FileDeleteSettings);
app.component('file-download-settings', FileDownloadSettings);
app.component('extension-script-settings', ExtensionScriptSettings);
app.component('image-caption-settings', ImageCaptionSettings);
app.component('web-reader-settings', WebReaderSettings);
app.component('knowledge-api-settings', KnowledgeApiSettings);
app.component('knowledge-params-settings', KnowledgeParamsSettings);
app.component('knowledge-manage-settings', KnowledgeManageSettings);
app.component('task-prompt-settings', TaskPromptSettings);
app.component('cron-job-settings', CronJobSettings);
app.component('memory-settings', MemorySettings);
app.mount('#app');
</script>
</body>
</html>
