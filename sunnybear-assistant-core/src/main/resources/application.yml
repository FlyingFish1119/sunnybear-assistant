server:
  port: 11451

spring:
#  profiles:
#    active: remote
  application:
    name: assistant
  datasource:
    url: jdbc:sqlite:${assistant.file.base-path}assistant.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1              # SQLite 仅支持单写，连接池设为 1
      connection-timeout: 5000
      idle-timeout: 300000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always                      # 每次启动执行 schema.sql
      schema-locations:
        - classpath:sql/schema.sql
        - classpath:sql/character_schema.sql
        - classpath:sql/world_schema.sql

# 助手业务配置
assistant:
  upload:
    tmp-expire-hours: 24
    cleanup-interval-ms: 3600000
    cleanup-initial-delay-ms: 600000
  file:
    base-path: data/
  settings:
    base-path: ${assistant.file.base-path}settings/
  cache:
    max-size: 1000
    expire-minutes: 10
  chat:
    async:
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 100
      thread-name-prefix: chat-async-

# QQ Bot（OneBot）配置
plug:
  file-path: ${assistant.file.base-path}plugins/
  qq:
    # QQ 环境附加提示词：追加在全局主提示词之后，用于声明当前运行环境与输出风格（改后需重启生效）
    prompt: |
      ## 附加规则：当前运行环境为 QQ

      当前对话发生在 QQ 里，是通过 QQ 发过来的消息，不是网页聊天界面。以下规则补充在前述人格设定之后，涉及篇幅与句式的部分优先级更高，与前述设定冲突时以本节为准。

      ### 一、格式：纯文本，零 Markdown
      1. QQ 不渲染任何标记语法，所有符号都会原样显示。因此禁止使用：# 标题、** 加粗、* 或 - 作为列表符号、表格、代码块围栏、行内反引号、链接语法。
      2. 需要分层时用空行分段，或用「一、」「1.」这类朴素序号，最多到两级。
      3. 需要强调时靠措辞，不靠符号堆砌。

      ### 二、篇幅：短句，收着说
      1. 单条消息控制在几句话之内，长句让位于短句。人格设定中「长句多于短句」「内容详尽、逻辑严密」是网页端的要求，在 QQ 里不适用。
      2. 只回答被问到的，不主动铺开延伸、不做完整的方案罗列；需要更多时对方会再问。
      3. 寒暄、报幕、总结性收尾能省则省，直接说事。

      ### 三、语气：像聊天，不像写文档
      1. 比网页端更放松、更口语，允许口语化的短句和不完整的句式。
      2. 说话的人没有变，称呼与自称仍按人格设定来。

      ### 四、内容较长时的分条
      1. 确实需要分条发送时，在要断开的位置单独占一行写 %%%（三个百分号），系统会按这个记号把内容拆成几条连续发出。
      2. 不需要分条时不要写它，也不要为了分条而分条。
      3. %%% 只用于分条，不要出现在正文其他位置，也不要用别的记号代替。
    bot:
      api-url: http://127.0.0.1:3000
      replay-ids:
        - 978993313
  android:
    tool:
      enable: true
  comfyui:
    bridge:
      command-timeout-s: 1800
    tool:
      enable: true
  world:
    processor:
      max-scheduler-attempts: 2
      scheduler-context-turns: 2

engine:
  tool:
    jev-danger:
      threshold: 0.15
    extension:
      dir: tool-extension/
  chat:
    idle-timeout-s: 45
    connection-timeout-s: 30
  jev:
    url: https://api.commandcode.ai/provider/v1/systemone
    api-key: ${COMMAND_CODE_API_KEY:}
    model: jev
    timeout-s: 30
  tts:
    enable: true
    base-url: https://api.siliconflow.cn/v1/audio/speech
    api-key: ${SILICONFLOW_API_KEY:}
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:alex
    format: mp3
  adapter-register:
    model-cache-ttl-minutes: 30
    register:
      # Kimi（Moonshot）流式
      - apiName: moonshot
        baseUrl: https://api.moonshot.cn/v1/chat/completions
        modelUrl: https://api.moonshot.cn/v1/models
        apiKey: ${MOONSHOT_API_KEY:}
        stream: true
        adapterCls: com.fishsunny.assistant.engine.adapter.standard.old.StandardStreamAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.standard.request.old.StandardAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.standard.StandardStreamAIResponse

      # Kimi（Moonshot）非流式
      - apiName: moonshot
        baseUrl: https://api.moonshot.cn/v1/chat/completions
        modelUrl: https://api.moonshot.cn/v1/models
        apiKey: ${MOONSHOT_API_KEY:}
        stream: false
        adapterCls: com.fishsunny.assistant.engine.adapter.standard.old.StandardAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.standard.request.old.StandardAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.standard.StandardAIResponse

