server:
  port: 11451

spring:
  profiles:
   active: headless
  application:
    name: assistant
  datasource:
    url: jdbc:sqlite:${assistant.file.base-path}assistant.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1              # SQLite 仅支持单写，连接池设为 1
      connection-timeout: 5000
      idle-timeout: 300000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always                      # 每次启动执行 schema.sql
      schema-locations:
        - classpath:sql/schema.sql
        - classpath:sql/character_schema.sql
        - classpath:sql/world_schema.sql

# 助手业务配置
assistant:
  upload:
    tmp-expire-hours: 24
    cleanup-interval-ms: 3600000
    cleanup-initial-delay-ms: 600000
  file:
    base-path: data/
  settings:
    base-path: ${assistant.file.base-path}settings/
  cache:
    max-size: 1000
    expire-minutes: 10
  chat:
    async:
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 100
      thread-name-prefix: chat-async-
  remote-storage:
    # local  = 权威库这一侧，执行 SQL；remote = 客户端这一侧，把仓储调用发出去
    role: ${REMOTE_ROLE:local}
    # 节点名
    node: ${REMOTE_NODE:local-node}
    timeout-ms: 15000
    keep-alive-interval-ms: 30000
    link:
      # connect 主动连出去 / accept 等对方连进来 / both 两样都干
      behavior: connect
      # role=remote 时主动连的目标
      remote:
        url: ${REMOTE_URL:ws://127.0.0.1:11451}
        username: ${REMOTE_USERNAME:username}
        password: ${REMOTE_PASSWORD:password}
      # role=local 时主动连的目标：同时向多台 remote 提供服务
      local-urls: []
      reconnect:
        initial-delay-ms: 3000
        max-delay-ms: 60000


# QQ Bot（OneBot）配置
plug:
  file-path: ${assistant.file.base-path}plugins/
  qq:
    prompt: |
      ## 附加规则：当前运行环境为 QQ

      当前对话发生在 QQ 里，是通过 QQ 发过来的消息，不是网页聊天界面。以下规则补充在前述人格设定之后，涉及篇幅与句式的部分优先级更高，与前述设定冲突时以本节为准。

      ### 一、格式：纯文本，零 Markdown
      1. QQ 不渲染任何标记语法，所有符号都会原样显示。因此禁止使用：# 标题、** 加粗、* 或 - 作为列表符号、表格、代码块围栏、行内反引号、链接语法。
      2. 需要分层时用空行分段，或用「一、」「1.」这类朴素序号，最多到两级。
      3. 需要强调时靠措辞，不靠符号堆砌。

      ### 二、篇幅：短句，收着说
      1. 单条消息控制在几句话之内，长句让位于短句。人格设定中「长句多于短句」「内容详尽、逻辑严密」是网页端的要求，在 QQ 里不适用。
      2. 只回答被问到的，不主动铺开延伸、不做完整的方案罗列；需要更多时对方会再问。
      3. 寒暄、报幕、总结性收尾能省则省，直接说事。

      ### 三、语气：像聊天，不像写文档
      1. 比网页端更放松、更口语，允许口语化的短句和不完整的句式。
      2. 说话的人没有变，称呼与自称仍按人格设定来。
    bot:
      api-url: http://127.0.0.1:3000
      replay-ids:
        - 978993313
  android:
    tool:
      enable: true
  comfyui:
    bridge:
      command-timeout-s: 1800
    tool:
      enable: true
  world:
    processor:
      max-scheduler-attempts: 2
      scheduler-context-turns: 2

engine:
  tool:
    jev-danger:
      threshold: 0.15
    extension:
      dir: tool-extension/
  chat:
    idle-timeout-s: 45
    connection-timeout-s: 30
  jev:
    url: https://api.commandcode.ai/provider/v1/systemone
    api-key: ${COMMAND_CODE_API_KEY:}
    model: jev
    timeout-s: 30
  tts:
    enable: true
    base-url: https://api.siliconflow.cn/v1/audio/speech
    api-key: ${SILICONFLOW_API_KEY:}
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:alex
    format: mp3
  adapter-register:
    model-cache-ttl-minutes: 30
    register:
      # DeepSeek 非流式
      - apiName: deepseek
        baseUrl: https://api.deepseek.com/chat/completions
        modelUrl: https://api.deepseek.com/models
        apiKey: ${DEEPSEEK_API_KEY:}
        stream: false
        adapterCls: com.fishsunny.assistant.engine.adapter.standard.multimodal.MultimodalAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.standard.request.multimodal.MultimodalAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.standard.StandardAIResponse
      # DeepSeek 流式
      - apiName: deepseek
        baseUrl: https://api.deepseek.com/chat/completions
        modelUrl: https://api.deepseek.com/models
        apiKey: ${DEEPSEEK_API_KEY:}
        stream: true
        adapterCls: com.fishsunny.assistant.engine.adapter.standard.multimodal.MultimodalAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.standard.request.multimodal.MultimodalAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.standard.StandardAIResponse

      # Gemini 非流式
      # 模型名拼在 URL 路径上，baseUrl 配到 /v1beta/models 为止，具体模型由模型设置里的 model 决定
      - apiName: gemini
        baseUrl: https://generativelanguage.googleapis.com/v1beta/models
        modelUrl: https://generativelanguage.googleapis.com/v1beta/models
        apiKey: ${GEMINI_API_KEY:}
        stream: false
        adapterCls: com.fishsunny.assistant.engine.adapter.gemini.GeminiAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.gemini.GeminiAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.gemini.GeminiAIResponse
      # Gemini 流式
      # 模型名拼在 URL 路径上，baseUrl 配到 /v1beta/models 为止，具体模型由模型设置里的 model 决定
      - apiName: gemini
        baseUrl: https://generativelanguage.googleapis.com/v1beta/models
        modelUrl: https://generativelanguage.googleapis.com/v1beta/models
        apiKey: ${GEMINI_API_KEY:}
        stream: true
        adapterCls: com.fishsunny.assistant.engine.adapter.gemini.GeminiStreamAIAdapter
        masterReqCls: com.fishsunny.assistant.engine.protocol.project.ChatRequest
        targetReqCls: com.fishsunny.assistant.engine.protocol.gemini.GeminiAIRequest
        masterRespCls: com.fishsunny.assistant.engine.protocol.project.ChatResponse
        targetRespCls: com.fishsunny.assistant.engine.protocol.gemini.stream.GeminiStreamResponse