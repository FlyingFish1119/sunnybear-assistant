name: project-stats
description: 统计项目文件数量、体积、类型分布与源码行数（跳过 lib/target/node_modules 等依赖与构建目录；行数区分代码/空行/注释）
type: powershell
parameters:
  - name: path
    type: string
    description: 要扫描的项目根目录，默认为当前目录
    required: false
script: |
  chcp 65001 > $null
  $py = "E:\project\sunnybear-assistant\sunnybear-assistant-core\tool-extension\dev\project_stats.py"
  if (-not (Test-Path $py)) {
    Write-Host "找不到脚本: $py"
    exit 1
  }
  $argv = @()
  $target = "{{path}}"
  if ($target -and ($target -notmatch '\{\{')) {
    $argv += @("--path", $target)
  }
  & python $py @argv 2>&1
  exit $LASTEXITCODE
