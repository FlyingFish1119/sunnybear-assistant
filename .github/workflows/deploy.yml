name: Deploy (core)

on:
  push:
    branches: [main]
    paths:
      - 'sunnybear-assistant-core/**'
      - '.github/workflows/**'
  workflow_dispatch:

# 同一分支同时只允许一个跑，避免连续 push 时两个部署互相踩
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # 服务器上的部署目录；deploy.sh 负责在服务器上拉代码、编译、重启
  DEPLOY_PATH: /opt/sunnybear-assistant

jobs:
  deploy:
    name: 触发服务器部署
    runs-on: ubuntu-latest
    steps:
      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 不再在 CI 里打包、上传那 300MB 的 jar：服务器上 git pull + 编译 + 重启，
      # 这里只负责远程触发一次 deploy.sh。
      # data/ settings/ tool-extension/ 一律不碰，由脚本自己照看。
      # accept-new：删掉了原来的 scp 步骤后，主机指纹要在这里自己接受。
      # LogLevel=ERROR：压掉 ssh 提示，别让主机名在公开日志里露脸。
      - name: 执行服务器部署脚本
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o LogLevel=ERROR \
              -i ~/.ssh/id_ed25519 \
              "$SSH_USER@$SSH_HOST" \
              "cd $DEPLOY_PATH && ./deploy.sh"

      - name: 清理私钥
        if: always()
        run: rm -f ~/.ssh/id_ed25519
